apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: app
  name: app
  namespace: hammurabi
spec:
  # OrbStack provisions local LoadBalancers; `kubectl -n hammurabi port-forward svc/app` is
  # the fallback. Port 8090 (not 8080/8081/8082) so Hammurabi's LB can coexist with other
  # local stacks.
  type: LoadBalancer
  ports:
    - name: "8090"
      port: 8090
      targetPort: 8090
  selector:
    io.kompose.service: app
