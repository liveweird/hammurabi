apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: app
  name: app
  namespace: hammurabi
spec:
  # ClusterIP on purpose: the only way in is the ingress-nginx Ingress (ingress.yaml), and network-policies.yaml
  # lets only that controller's pods reach the app pod. A LoadBalancer/NodePort would give clients a direct path
  # around the proxy, where X-Forwarded-* is client-controlled. For debugging, `kubectl -n hammurabi port-forward
  # svc/app 8090` reaches the pod without the proxy (production mode then answers plain HTTP with its 301 to https
  # unless the request carries X-Forwarded-Proto: https).
  type: ClusterIP
  ports:
    - name: "8090"
      port: 8090
      targetPort: 8090
  selector:
    io.kompose.service: app
