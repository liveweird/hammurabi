        actions: { $ref: '#/components/schemas/AdrMyWorkAttentionSection' }
        watching: { $ref: '#/components/schemas/AdrMyWorkAttentionSection' }
        activity: { $ref: '#/components/schemas/AdrMyWorkActivitySection' }
        adrs: { $ref: '#/components/schemas/AdrMyWorkAdrSection' }
    AdrEventType:
      type: string
      enum:
        - CREATED
        - UPDATED
        - TRANSITIONED
        - PARTICIPANT_ADDED
        - PARTICIPANT_REMOVED
        - PARTICIPANT_CHANGED
        - EXPIRED
        - SUPERSEDED
        - TAGS_CHANGED
        - SUCCESSOR_LINKED
        - SUCCESSOR_UNLINKED
        - SUCCESSOR_ACTIVATED
        - SUCCESSOR_ACCEPTED
        - COMMENTED
        - QUESTION_ASKED
        - QUESTION_ANSWERED
        - QUESTION_REOPENED
        - ISSUE_RAISED
        - ESCALATED
        - ISSUE_RESOLVED
        - ISSUE_REOPENED
        - PREDECESSOR_ENDED
      description: >-
        The kinds of history, with their `params` (all strings): `CREATED` {key, name}; `UPDATED` {changed: comma-joined field names,
        `name.from`/`name.to`/`expiresOn.from`/`expiresOn.to` where short}; `TRANSITIONED` {from, to, reason?} (the optional free-text reason of the move, 0.7.0); `PARTICIPANT_ADDED` and
        `PARTICIPANT_REMOVED` {userId, name, role}; `PARTICIPANT_CHANGED` {userId, name, from, to}; `EXPIRED` {expiresOn}, a system
        event; `SUPERSEDED` {successorId, key, name}, on the predecessor, when its successor became `ACTIVE` (the actor is the user who
        activated it); `SUCCESSOR_ACTIVATED` {predecessorId, key, name}, on the successor, in the same transaction; `TAGS_CHANGED`
        {added, removed}, comma-joined tag names, each key only when non-empty; `SUCCESSOR_LINKED` / `SUCCESSOR_UNLINKED`
        {predecessorId, key, name}, on the successor (a `SUCCESSOR_UNLINKED` is also written on the predecessor when its owner detaches
        the pending successor, then {successorId, key, name}); `SUCCESSOR_ACCEPTED` {predecessorId, key, name} on the successor and
        {successorId, key, name} on the predecessor when the predecessor's Approver (or an administrator) accepted the pending successor; `PREDECESSOR_ENDED` {predecessorId, key, name, status}, on the pending successor, when the ADR it was set to replace was cancelled, withdrawn or expired (`status` is the new one; the actor is who ended it, none for the expiry sweep). The discussion events (`COMMENTED`, `QUESTION_ASKED`, `QUESTION_ANSWERED`,
        `QUESTION_REOPENED`, `ISSUE_RAISED`, `ESCALATED`, `ISSUE_RESOLVED`, `ISSUE_REOPENED`) carry {entryId, kind} - never the text; an edit
        or a delete of an entry is not an event.
    AdrEventResponse:
      type: object
      required: [id, actorId, actorName, actorDeleted, type, params, createdAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        actorId: { type: integer, format: int32, minimum: 0, nullable: true, description: "The acting user; null = the system." }
        actorName: { type: string, nullable: true, description: "The actor's display name; null with `actorId`." }
        actorDeleted: { type: boolean, description: "The acting account has since been soft-deleted (the name is still the one recorded)." }
        type: { $ref: '#/components/schemas/AdrEventType' }
        params:
          type: object
          additionalProperties: { type: string }
        createdAt: { type: integer, format: int64, description: "Epoch millis" }
    AdrEventPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdrEventResponse'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0

    TagCategoryRequest:
      type: object
      required: [name, tags]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        description: { type: string, maxLength: 500, nullable: true }
        tags:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 40 }
          description: The category's whole tag list, each once after normalisation.
    TagCategory:
      type: object
      required: [id, name, description, revision, tags]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        revision: { type: integer, format: int64, minimum: 1, description: "Send it back as `X-Expected-Revision` on this category's PUT or DELETE; starts at 1, every PUT bumps it." }
        tags:
          type: array
          items: { type: string }
          description: The category's live tags (normalised), alphabetical.
    TagCategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TagCategory' }

    LensVisibility:
      type: string
      enum: [PRIVATE, PUBLIC]
    AdrFilterDocument:
      type: object
      description: >-
        The ADR list's filters as one document - the names and meanings of the `GET /adrs` query parameters (`status` and `tag` as arrays).
        Every key is optional (absent = not filtered on); a blank string or an empty array is read as absent.
      properties:
        status:
          type: array
          maxItems: 8
          items: { $ref: '#/components/schemas/AdrStatus' }
        q: { type: string, maxLength: 100 }
        text: { type: string, maxLength: 100 }
        participantId: { type: integer, format: int32, minimum: 0 }
        participantRole: { $ref: '#/components/schemas/AdrRole' }
        tag:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 40 }
        createdFrom: { type: string, format: date }
        createdTo: { type: string, format: date }
        updatedFrom: { type: string, format: date }
        updatedTo: { type: string, format: date }
        expiresBefore: { type: string, format: date }
        hasOpenIssues: { type: boolean }
        hasPredecessor: { type: boolean }
        hasSuccessor: { type: boolean }
    LensRequest:
      type: object
      required: [name, visibility, filters]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        visibility: { $ref: '#/components/schemas/LensVisibility' }
        filters: { $ref: '#/components/schemas/AdrFilterDocument' }
    Lens:
      type: object
      required: [id, name, visibility, filters, createdById, createdByName, createdByDeleted, createdAt, updatedAt, canEdit, canDelete]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        visibility: { $ref: '#/components/schemas/LensVisibility' }
        filters: { $ref: '#/components/schemas/AdrFilterDocument' }
        createdById: { type: integer, format: int32, minimum: 0 }
        createdByName: { type: string }
        createdByDeleted: { type: boolean }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
        canEdit: { type: boolean, description: "The caller is the creator: may rename, flip the visibility and replace the filters." }
        canDelete: { type: boolean, description: "The caller is the creator, or an ADMIN looking at a PUBLIC lens." }
    NotificationType:
      type: string
      enum:
        - ROLE_ASSIGNED
        - ROLE_REMOVED
        - STATUS_CHANGED
        - DISCUSSION_POSTED
        - DISCUSSION_SETTLED
        - ADR_EXPIRED
        - ADR_SUPERSEDED
        - SUCCESSOR_LINKED
        - SUCCESSOR_UNLINKED
        - EXPIRY_REMINDER
        - EXPIRY_CHANGED
        - SUCCESSOR_ACCEPTED
        - PREDECESSOR_ENDED
      description: >-
        What happened. `ROLE_ASSIGNED` / `ROLE_REMOVED` (`detail` = the DACI role), `STATUS_CHANGED` (`detail` = the new status, or `SENT_BACK` for an in-review ADR returned to draft; every
        participant, Informed included, never the reason), `DISCUSSION_POSTED` (`detail` = the entry kind; the Driver and the Approver, Contributors too for
        a comment or a question), `DISCUSSION_SETTLED` (`detail` = the kind; the author of the answered question or resolved issue),
        `ADR_EXPIRED` (`detail` = the expiry date) and `ADR_SUPERSEDED` (`otherAdr` = the successor) for every participant,
        `SUCCESSOR_LINKED` / `SUCCESSOR_UNLINKED` (the predecessor's Driver and Approver; `adr` is the predecessor, `otherAdr` the
        successor) and `EXPIRY_REMINDER` (`detail` = the expiry date; the Driver and the Approver; a system notice) and `EXPIRY_CHANGED`
        (the expiry date of an `ACTIVE` ADR was changed or removed; `detail` = the new date, null = removed; every participant, the actor
        excepted) and `SUCCESSOR_ACCEPTED` (the predecessor's Approver accepted a successor: `adr` is the successor, `otherAdr` the predecessor it
        replaces; the successor's Driver and Approver) and `PREDECESSOR_ENDED` (the ADR a successor was set to replace was cancelled, withdrawn or
        expired: `adr` is the successor, `otherAdr` the predecessor that ended and `detail` its new status; the successor's Driver and Approver, the
        actor excepted). A client treats an unknown value as plain text.
    Notification:
      type: object
      required: [id, type, seen, createdAt, actorId, actorName, adrId, adrKey, adrName, otherAdrId, otherAdrKey, detail]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        type: { $ref: '#/components/schemas/NotificationType' }
        seen: { type: boolean }
        createdAt: { type: integer, format: int64 }
        actorId: { type: integer, format: int32, minimum: 0, nullable: true, description: "The person whose write caused the notice; null = the system." }
        actorName: { type: string, nullable: true, description: "The actor's current name, read when the page is read." }
        adrId: { type: integer, format: int32, minimum: 0, description: "The ADR the notice is about; the deep link is `/adrs/{adrId}`." }
        adrKey: { type: string, description: "`ADR-0042`." }
        adrName: { type: string, description: "The ADR's current name." }
        otherAdrId: { type: integer, format: int32, minimum: 0, nullable: true, description: "The second ADR of a successor notice." }
        otherAdrKey: { type: string, nullable: true }
        detail: { type: string, nullable: true, description: "The role, status, entry kind or date the type needs; null otherwise." }
    NotificationPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000
          description: The number of rows, CAPPED at 1000 (a count at the cap means "at least this many").
    NotificationPreferenceKind:
      type: object
      description: "One kind and its two switches: an element of `kinds` in what the GET answers AND in what the PUT takes."
      required: [type, inApp, email]
      properties:
        type: { $ref: '#/components/schemas/NotificationType' }
        inApp: { type: boolean, description: "The bell: false = no notice of this kind is made for the person from then on." }
        email: { type: boolean, description: "The digest: false = a notice of this kind is never mailed; the bell is unchanged." }
    NotificationPreferences:
      type: object
      required: [emailAvailable, kinds]
      properties:
        emailAvailable: { type: boolean }
        kinds:
          type: array
          items: { $ref: '#/components/schemas/NotificationPreferenceKind' }
    NotificationPreferencesUpdateRequest:
      type: object
      required: [kinds]
      properties:
        kinds:
          type: array
          maxItems: 13
          description: "One entry per kind at most (the `kinds` of the GET, edited and sent back); a kind left out is on."
          items: { $ref: '#/components/schemas/NotificationPreferenceKind' }
    LensPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Lens' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0

    DiscussionKind:
      type: string
      enum: [COMMENT, QUESTION, ISSUE, ESCALATION]
      description: >-
        `COMMENT` and `QUESTION` are accepted while the ADR is pre-active (`PROBLEM_RAISED`, `SOLUTION_DRAFT`, `IN_REVIEW`); `ISSUE` and
        `ESCALATION` only while it is `ACTIVE`.
    DiscussionState:
      type: string
      enum: [OPEN, ANSWERED, RESOLVED]
      description: >-
        A `QUESTION` is `OPEN` or `ANSWERED`; an `ISSUE` or `ESCALATION` is `OPEN` or `RESOLVED`. A `COMMENT` and a deleted entry have none.
    DiscussionCreateRequest:
      type: object
      required: [kind, body]
      properties:
        kind: { $ref: '#/components/schemas/DiscussionKind' }
        body: { type: string, minLength: 1, maxLength: 10000, description: "Markdown; not blank." }
    DiscussionEditRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 10000, description: "The new Markdown text; not blank." }
    DiscussionStateRequest:
      type: object
      required: [state]
      properties:
        state: { $ref: '#/components/schemas/DiscussionState' }
        resolution:
          type: string
          maxLength: 2000
          nullable: true
          description: An optional note, only with `RESOLVED` (`400` with any other state); blank = none.
    DiscussionEntry:
      type: object
      required:
        - id
        - adrId
        - revision
        - kind
        - body
        - deleted
        - authorId
        - authorName
        - authorDeleted
        - createdAt
        - editedAt
        - resolution
        - stateChangedById
        - stateChangedByName
        - stateChangedByDeleted
        - stateChangedAt
        - canEdit
        - canDelete
        - canChangeState
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        adrId: { type: integer, format: int32, minimum: 0 }
        revision: { type: integer, format: int64, minimum: 1, description: "The per-entry concurrency token; real edits, state or note changes, and deletion increment it. Discussion writes never increment the parent ADR revision." }
        kind: { $ref: '#/components/schemas/DiscussionKind' }
        state:
          allOf:
            - $ref: '#/components/schemas/DiscussionState'
          description: Absent for a comment and for a tombstone (neither has a state).
        body: { type: string, nullable: true, description: "Markdown; null for a tombstone (the text is gone)." }
        deleted: { type: boolean, description: "A tombstone: the entry was deleted; only its kind, author and creation time remain." }
        authorId: { type: integer, format: int32, minimum: 0 }
        authorName: { type: string, description: "The author's display name as it is now (kept for a soft-deleted account)." }
        authorDeleted: { type: boolean, description: "The author's account has since been soft-deleted." }
        createdAt: { type: integer, format: int64, description: "Epoch millis" }
        editedAt: { type: integer, format: int64, nullable: true, description: "Epoch millis of the author's last edit." }
        resolution: { type: string, nullable: true, description: "The note of the last resolution, if it had one; cleared on a reopen." }
        stateChangedById: { type: integer, format: int32, minimum: 0, nullable: true, description: "Who last answered, resolved or reopened the entry; null when nobody did (and for a tombstone)." }
        stateChangedByName: { type: string, nullable: true, description: "That user's display name as it is now; null with `stateChangedById`." }
        stateChangedByDeleted: { type: boolean, description: "That user's account has since been soft-deleted (false when there is none)." }
        stateChangedAt: { type: integer, format: int64, nullable: true, description: "Epoch millis" }
        canEdit: { type: boolean, description: "This caller is the author and the ADR's status still takes the kind." }
        canDelete: { type: boolean, description: "This caller is the author or an ADMIN and the entry is not deleted yet." }
        canChangeState: { type: boolean, description: "This caller may answer, resolve or reopen the entry (any ADR status; false for a comment and a tombstone)." }
    DiscussionPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DiscussionEntry'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0

    ProblemDetail:
      type: object
      description: RFC 7807 problem detail. Served as `application/problem+json`; instance is the request path without query parameters.
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          default: about:blank
          description: |
            A URI reference identifying the problem type: `about:blank`, or one of the typed problems below, which a client tells apart
            from the plain status by the URI, never by the detail text. This list is the whole set (it equals the server's registry,
            `ProblemTypes`, pinned by `ProblemTypesTest`); the status in brackets is the one it answers.

            - `urn:hammurabi:problem:revision-conflict` (409): a stale `X-Expected-Revision`.
            - `urn:hammurabi:problem:illegal-transition` (409): an ADR lifecycle move the map does not allow, or one only the system makes.
            - `urn:hammurabi:problem:adr-frozen` (409): a write the ADR's status closes - content (and the successor link) once `ACTIVE`, anything once terminal.
            - `urn:hammurabi:problem:successor-not-accepted` (409): a successor activated over a decision in force whose Approver has not accepted the link - `POST /adrs/{id}/successor/accept` on the predecessor first.
            - `urn:hammurabi:problem:last-administrator` (409): a demotion or deletion of a user that would leave no active administrator (`PUT` / `DELETE /users/{id}`); an email already in use is a plain 409.
            - `urn:hammurabi:problem:search-timeout` (429, `Retry-After`): a full-text search outran its deadline - narrow it.
            - `urn:hammurabi:problem:search-busy` (429, `Retry-After`): the server already runs its maximum of searches - retry shortly.
            - `urn:hammurabi:problem:export-busy` (429, `Retry-After`): the server already streams its maximum of bulk ADR exports - retry shortly.
            - `urn:hammurabi:problem:discussion-closed` (409): a discussion write the ADR's status does not take - a comment or question once `ACTIVE`, an issue or escalation before it (a post or an edit; a state change and a delete have no window).
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          description: URI reference of the specific occurrence (the request path).

    TelemetryCurrent:
      type: object
      required: [generatedAt, sampleIntervalSeconds, processes, storage, requests]
      properties:
        generatedAt: { type: integer, format: int64, description: Epoch millis }
        sampleIntervalSeconds: { type: integer, format: int32, description: The cadence of the raw samples; also the `requests` window. }
        processes:
          type: array
          items: { $ref: '#/components/schemas/TelemetryProcess' }
        storage:
          allOf: [{ $ref: '#/components/schemas/TelemetryStorage' }]
          nullable: true
          description: The newest storage measurement; null until the cluster section has taken one.
        requests: { $ref: '#/components/schemas/TelemetryRequests' }
    TelemetryProcess:
      type: object
      description: One sampling process (a JVM run) with its latest raw sample.
      required: [id, role, instance, startedAt, lastSeenAt, sampledAt, stale, version, commit, memory, jvm]
      properties:
        id: { type: integer, format: int32 }
        role: { type: string, description: 'The process role; `app`.' }
        instance: { type: string, description: The pod or host name. }
        startedAt: { type: integer, format: int64, description: Epoch millis of the JVM start }
        lastSeenAt: { type: integer, format: int64, description: Epoch millis of the latest sample tick }
        sampledAt: { type: integer, format: int64, nullable: true, description: The bucket of the sample the figures come from; null when none is retained. }
        stale: { type: boolean, description: No sample for more than three sample intervals. }
        version: { type: string, nullable: true, description: The image build version (null outside the image). }
        commit: { type: string, nullable: true, description: The image build commit (null outside the image). }
        memory: { $ref: '#/components/schemas/TelemetryMemory' }
        jvm: { $ref: '#/components/schemas/TelemetryJvm' }
    TelemetryMemory:
      type: object
      description: Bytes; a figure the process could not measure is null.
      required:
        - heapUsedBytes
        - heapCommittedBytes
        - heapMaxBytes
        - oldGenPeakBytes
        - nonHeapBytes
        - directBytes
        - rssBytes
        - cgroupCurrentBytes
        - cgroupAnonBytes
        - workingSetBytes
        - cgroupPeakBytes
        - containerLimitBytes
        - percentOfLimit
      properties:
        heapUsedBytes: { type: integer, format: int64, nullable: true }
        heapCommittedBytes: { type: integer, format: int64, nullable: true }
        heapMaxBytes: { type: integer, format: int64 }
        oldGenPeakBytes: { type: integer, format: int64, nullable: true, description: The old generation's peak over the latest sample interval. }
        nonHeapBytes: { type: integer, format: int64, nullable: true }
        directBytes: { type: integer, format: int64, nullable: true }
        rssBytes: { type: integer, format: int64, nullable: true }
        cgroupCurrentBytes: { type: integer, format: int64, nullable: true }
        cgroupAnonBytes: { type: integer, format: int64, nullable: true }
        workingSetBytes: { type: integer, format: int64, nullable: true, description: '`memory.current - inactive_file`: what the kubelet evicts on.' }
        cgroupPeakBytes: { type: integer, format: int64, nullable: true, description: The cgroup's LIFETIME peak. }
        containerLimitBytes: { type: integer, format: int64, nullable: true }
        percentOfLimit:
          type: number
          format: double
          nullable: true
          description: '`workingSetBytes` over `containerLimitBytes`, in percent (one decimal; may exceed 100); null without a limit or a working set.'
    TelemetryJvm:
      type: object
      required: [cpuRatio, threads, gcCount, gcTimeMs, poolAcquired, poolIdle, poolPending, poolAllocated]
      properties:
        cpuRatio: { type: number, format: double, nullable: true, description: Process CPU time over wall time as a fraction of the available processors (0..1). }
        threads: { type: integer, format: int32, nullable: true }
        gcCount: { type: integer, format: int64, nullable: true, description: 'Collections over the latest sample interval, all collectors summed.' }
        gcTimeMs: { type: integer, format: int64, nullable: true, description: 'Collection time over the latest sample interval, all collectors summed.' }
        poolAcquired: { type: integer, format: int32, nullable: true }
        poolIdle: { type: integer, format: int32, nullable: true }
        poolPending: { type: integer, format: int32, nullable: true }
        poolAllocated: { type: integer, format: int32, nullable: true }
    TelemetryStorage:
      type: object
      required: [measuredAt, databaseBytes, schemas]
      properties:
        measuredAt: { type: integer, format: int64, description: Epoch millis of the measurement's bucket }
        databaseBytes: { type: integer, format: int64, description: '`pg_database_size`.' }
        schemas:
          type: array
          items: { $ref: '#/components/schemas/TelemetrySchemaSize' }
    TelemetrySchemaSize:
      type: object
      required: [name, bytes]
      properties:
        name: { type: string, description: 'public or ops (telemetry''s own cost).' }
        bytes: { type: integer, format: int64, description: "Heap, TOAST and indexes of the schema's tables." }
    TelemetryRequests:
      type: object
      required: [windowSeconds, percentileWindowSeconds, measuredAt, total, routes]
      properties:
        windowSeconds: { type: integer, format: int32, description: The window of the counts - the latest sample interval. }
        percentileWindowSeconds:
          type: integer
          format: int32
          description: The window p50 and p95 cover - the sample interval capped at 300 s (the request timers' reservoir), so it can be shorter than `windowSeconds`.
        measuredAt: { type: integer, format: int64, nullable: true, description: The sample bucket the figures describe; null when no live process has a sample. }
        total: { $ref: '#/components/schemas/TelemetryRouteStats' }
        routes:
          type: array
          maxItems: 15
          items: { $ref: '#/components/schemas/TelemetryRouteStats' }
    TelemetryRouteStats:
      type: object
      description: One route (or `*`, every `/api/` route except the telemetry's own and the probes) over the latest sample interval.
      required: [route, count, p50Ms, p95Ms, serverErrors, rateLimited]
      properties:
        route: { type: string, description: 'The normalised route (`/api/v1/users/{id}`) or `*`.' }
        count: { type: integer, format: int64, minimum: 0 }
        p50Ms: { type: number, format: double, nullable: true, description: Null when nothing was served. }
        p95Ms: { type: number, format: double, nullable: true, description: Null when nothing was served. }
        serverErrors: { type: integer, format: int64, minimum: 0, description: 5xx responses. }
        rateLimited: { type: integer, format: int64, minimum: 0, description: 429 responses. }
    TelemetryHistory:
      type: object
      required: [group, range, bucketSeconds, from, to, historyFrom, truncated, series]
      properties:
        group: { type: string, enum: [memory, storage, requests, jvm] }
        range: { type: string, enum: [24h, 7d, 90d] }
        bucketSeconds: { type: integer, format: int32, description: The width of a point's bucket. }
        from: { type: integer, format: int64, description: Epoch millis of the range start (the first bucket may begin up to one bucket earlier). }
        to: { type: integer, format: int64, description: Epoch millis of the read }
        historyFrom: { type: integer, format: int64, description: The oldest instant the range can actually hold data for. }
        truncated: { type: boolean, description: 'More series matched than were returned (40).' }
        series:
          type: array
          maxItems: 40
          items: { $ref: '#/components/schemas/TelemetrySeries' }
    TelemetrySeries:
      type: object
      description: One chart line; `points` are the buckets that hold data, ascending, at most 400.
      required: [key, metric, label, role, unit, kind, points]
      properties:
        key: { type: string, description: 'Unique within the response (`<role>:<metric>:<label>`, empty parts left out).' }
        metric: { type: string, description: 'The metric name (`mem.heap_used`, `http.p95`, ...).' }
        label: { type: string, description: 'A route, a GC collector or a schema; empty when the metric has none.' }
        role: { type: string, nullable: true, description: 'The process role a `memory` / `jvm` series merges (`app`); null for cluster-wide and `requests` series.' }
        unit: { type: string, enum: [BYTES, MILLISECONDS, COUNT, RATIO] }
        kind:
          type: string
          enum: [GAUGE, DELTA, PERCENTILE]
          description: A DELTA point's `avg` is the bucket's total; for the others it is the n-weighted mean.
        points:
          type: array
          maxItems: 400
          items: { $ref: '#/components/schemas/TelemetryPoint' }
    TelemetryPoint:
      type: object
      required: [t, avg, max]
      properties:
        t: { type: integer, format: int64, description: Epoch millis of the bucket start }
        avg: { type: number, format: double }
        max: { type: number, format: double }

