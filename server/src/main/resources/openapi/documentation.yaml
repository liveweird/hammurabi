openapi: 3.1.0
info:
  title: hammurabi-api
  version: 1.3.0
  description: |
    JWT-authenticated REST API for Hammurabi — Architecture Decision Records (ADRs) across their lifecycle, with DACI
    responsibility. It serves the Hammurabi web app and is versioned by its `/api/v1` path prefix. It exposes the ADRs
    (`/adrs`: the record, its lifecycle transitions, its DACI participants, its tags, its successor link, its history and its discussion)
    the tag registry (`/tag-categories`), the saved ADR-list filters (`/lenses`) and the caller's own notifications (`/notifications`, with the
    per-user switches under `/users/{id}/notification-preferences`) on top of the accounts, teams, feature-flag and operational surface of the foundation.

    Authorization model: every user is implicitly a regular user; additional global roles (`ADMIN`) are carried as
    the `roles` array and only ever ADD privileges on top of that baseline. Every operation requires a bearer
    access token except the seven that declare `security: []` (`/login`, `/login/mfa`, `/refresh`, `/password-reset`,
    `/password-reset/confirm` and the two probes). Beyond that each operation states its own rule: user management (`/users`, apart from
    reading or changing one's own record where noted) and the writes on teams are `ADMIN` only; reading teams and the tag registry is open to
    any authenticated user, and the registry's writes are `ADMIN` only; telemetry is `ADMIN` only. A caller without the right gets a uniform `403`, whether or not the
    addressed resource exists. ADRs are an open decision log: every authenticated user reads every ADR and creates one
    (becoming its Driver); writes follow the DACI role the caller holds on that ADR ("the Driver drives, the Approver
    decides", `ADMIN` overrides), so a missing ADR is a plain `404` and a caller without the role gets `403` before the
    body is read.

    List operations page with `page` / `pageSize` / `sort` into an `{items, page, pageSize, total}` envelope.

    Concurrent writes: the documents several people edit carry a revision. The tag-category PUT and DELETE, the ADR document PUT, the ADR
    transitions, and the ADR's participants, tags and successor PUTs require `X-Expected-Revision` (a stale one is a typed `409`). Every
    other PUT is a whole-document replace where the last write wins, with no revision and no conflict detection: the user, feature-flag and
    language PUTs, the team PUT, the lens PUT, the discussion edit and state PUTs, and the notification-preferences PUT.

    A reference to a person is named `<role>Id` (`managerId`, `authorId`, `actorId`, `createdById`, `participantId`), its display text
    `<role>Name`, and a flag that the person's account was deleted `<role>Deleted`; plain `userId` only where the row is the user itself.

    All error responses use RFC 7807 `application/problem+json` (`ProblemDetail`). Any endpoint may additionally
    return `500` (`InternalServerError`) on an unexpected server fault.
servers:
  - url: http://localhost:8090
    description: Local dev

security:
  - bearerAuth: []

tags:
  - name: health
    description: Public liveness and readiness probes; they disclose nothing but a status.
  - name: auth
    description: Login (with the optional email second factor), token refresh, logout and the self-service password reset.
  - name: users
    description: Hammurabi's own login accounts - ADMIN-managed CRUD, per-user feature flags, language and password change, plus the user-picker directory open to any signed-in user.
  - name: teams
    description: Flat teams, each with an optional manager - readable by any authenticated user, written by ADMIN only.
  - name: tags
    description: The ADR tag registry - categories of tags curated by ADMIN, readable by any authenticated user; an ADR may carry only registered tags.
  - name: adrs
    description: Architecture Decision Records - the record, its lifecycle transitions, its DACI participants, its tags, its successor link, its history and its discussion (comments and questions before the decision is in force, issues and escalations while it is); readable and postable by any authenticated user, the record written by the roles the caller holds on the ADR.
  - name: lenses
    description: Lenses - named, saved ADR-list filters (the list's own filter names), PRIVATE to their creator or PUBLIC to every signed-in user; mutable by their creator only.
  - name: notifications
    description: The caller's own notices about the ADRs they take part in (a role given or taken away, a status change, discussion, expiry, successors, expiry reminders), the "seen" writes and the per-user switches of the bell and the digest email.
  - name: telemetry
    description: Hammurabi's own vital signs (process memory, JVM, storage, request latency) and their 24h/7d/90d trends - ADMIN only.

paths:
  /api/v1/health:
    get:
      tags: [health]
      operationId: health
      summary: Liveness probe
      description: |
        Public and unauthenticated (the container HEALTHCHECK and the k8s liveness probe call it):
        `200` proves the process answers requests. It touches nothing — use `/api/v1/ready` for the
        database round trip.
      security: []
      responses:
        '200':
          description: The process is up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/ready:
    get:
      tags: [health]
      operationId: ready
      summary: Readiness probe
      description: |
        Public and unauthenticated (the k8s readiness probe and the e2e global setup call it): `200`
        once a database round trip succeeds within a short budget, `503` while it does not — the pod
        leaves the Service until the database is back.
        Rate-limited per client IP (default 60/min, `READY_RATE_LIMIT_PER_MINUTE`; the kubelet needs
        12/min): over the bucket it answers `429`. `/api/v1/health` is not bucketed.
      security: []
      responses:
        '200':
          description: The app and its database answer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        '503':
          description: The database did not answer within the probe's budget
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/login:
    post:
      tags: [auth]
      operationId: login
      summary: Exchange credentials for a JWT
      description: |
        Rate-limited per client IP, and additionally throttled per account: after several
        consecutive failures for one email (default 5, `LOGIN_LOCKOUT_THRESHOLD`), further
        attempts for that account — even with the correct password — are rejected with `429`
        for a lockout window (default 15 min, `LOGIN_LOCKOUT_DURATION_SECONDS`). A successful
        login resets the counter (for an MFA-enabled account the accepted code does, see
        `POST /login/mfa`); wrong codes and wrong current passwords on a password change feed the
        same counter. A lock whose failure window held a wrong emailed code lasts longer each time it
        repeats (the n-th consecutive one lasts the window x 2^(n-1), up to
        `LOGIN_LOCKOUT_MFA_MAX_DURATION_SECONDS`, default 24 h; the level is forgotten after
        `LOGIN_LOCKOUT_MFA_DECAY_SECONDS` without a lock); a window of wrong passwords only stays the flat
        window. A confirmed password reset (`POST /password-reset/confirm`) lifts the lock and its level.
        The answer is the same `429` whatever the cause. The in-memory lockout store admits at most
        `LOGIN_LOCKOUT_MAX_TRACKED` identities (default 10,000). At capacity a new identity
        receives `429` before password verification; existing tracked identities continue,
        and expired state frees capacity. This applies equally to existing and unknown emails.

        **Email MFA (opt-in via the `MFA` feature flag):** when the account has MFA enabled,
        correct credentials answer `200` with an `MfaChallengeResponse` instead of tokens — a
        6-digit code is emailed to the account, and the client exchanges it together with the
        `challengeId` at `POST /api/v1/login/mfa` for the ordinary `LoginResponse`. On a
        deployment without outbound email (`MAIL_TRANSPORT=disabled`) an MFA-enabled login
        fails closed with `503`. The pending challenge store admits at most
        `MFA_MAX_TRACKED` challenges (default 10,000); new issuance at capacity receives
        `429` without sending a code, while existing challenges remain verifiable.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: Token issued, or (MFA-enabled accounts) a second-factor challenge
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginResponse'
                  - $ref: '#/components/schemas/MfaChallengeResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503':
          description: MFA is enabled for the account but this deployment cannot send email
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /api/v1/login/mfa:
    post:
      tags: [auth]
      operationId: verifyMfa
      summary: Exchange an MFA challenge and emailed code for a JWT pair
      description: |
        Second login step for MFA-enabled accounts. The `challengeId` comes from the login
        response, the 6-digit `code` from the email. Challenges are single-use, expire after
        a short TTL (default 5 min, `MFA_CODE_TTL_SECONDS`), and allow a few attempts
        (default 5, `MFA_MAX_ATTEMPTS`); every failure mode — unknown challenge, expired,
        wrong code, attempts exhausted, user gone, password changed — answers the uniform `401`. Rate-limited
        per client IP.

        Every wrong code also counts as a failed sign-in attempt toward the account's login lockout (the same
        counter `POST /login` feeds, `LOGIN_LOCKOUT_THRESHOLD`), so the wrong codes across ALL of an account's
        challenges add up and a fresh login never resets them (only an accepted code does). The failure that
        locks the account answers the uniform `401`; the account's pending challenges are dropped, and from
        then on `POST /login` answers `429` for the lockout window. A correct code for a locked account is
        refused with the lockout's `429`. Locks tripped by wrong codes double per consecutive lock, up to
        `LOGIN_LOCKOUT_MFA_MAX_DURATION_SECONDS` (default 24 h), and a confirmed password reset lifts the lock
        (see `POST /login`). An account holds at most 3 pending challenges: a further login
        replaces the oldest, whose code then fails as an unknown challenge.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Exchange a refresh token for a fresh access + refresh pair
      description: |
        Pure-sliding session renewal with refresh-token rotation. Accepts a valid, unexpired,
        non-revoked refresh token and returns a brand-new access token and refresh token (each with
        a full TTL). The presented refresh token is retired: it is blocklisted until its own expiry,
        so it works once. A replay of an already-rotated token is `401`, except that a replay within
        a short grace window after the rotation (60 seconds by default; it covers a response lost in
        flight, at most twice per token, and not after a logout that reached the server) is answered with another fresh pair.
        The superseded access token is not revoked and
        lives until its own expiry. Requires no `Authorization` header (the access token may
        already be expired). Returns `401` for a missing/invalid/expired/revoked/already-used
        refresh token, if the user no longer exists, or if the token's credential revision no
        longer matches the user's current credentials. Password changes invalidate earlier refresh
        tokens even within the same clock second. Legacy tokens without a credential revision
        require a fresh sign-in after upgrading to 0.14.1.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: A fresh token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the bearer token (server-side denylist)
      description: |
        Revokes the access token carried in the `Authorization` header. If a `refreshToken` is
        supplied in the body, it is revoked too. The body is optional.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Token revoked
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/password-reset:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: Request a self-service password reset
      description: |
        Normally answers `202` for a well-formed request, whether or not an account with that
        email exists (no account enumeration; the actual work happens asynchronously). If the
        account exists, a single-use reset link is emailed to its stored address. Requesting or
        opening a link never changes the password or any session: nothing changes until the owner
        confirms the link and chooses a new password (`POST /api/v1/password-reset/confirm`).
        Links expire after 15 minutes by default (`PASSWORD_RESET_TOKEN_TTL_SECONDS`, 1 to 3600
        seconds). Only a SHA-256 digest of the 256-bit random token is persisted, and the browser
        receives the token in a URL fragment, never in a server-visible path or query string.
        Throttled per submitted email — one request per interval
        (default 60 s, `PASSWORD_RESET_MIN_INTERVAL_SECONDS`) — uniformly for existing and
        unknown addresses, and rate-limited per client IP. The in-memory cooldown store admits
        at most `PASSWORD_RESET_MAX_TRACKED` identities (default 10,000). At capacity a new
        identity receives `429` and no reset email is scheduled; elapsed cooldowns free space.
        A soft-deleted account is unknown here (no link is minted or emailed, and the response
        follows the same acceptance and throttling rules). Answers `503` on deployments without
        outbound email (`MAIL_TRANSPORT=disabled`) or without a configured `MAIL_APP_URL` (the
        deployment's https origin, validated at startup, never derived from the `Host` header).
        Several requested links may coexist; completing one invalidates all of them.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '202':
          description: Accepted — if the account exists, an email is on its way
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503':
          description: This deployment cannot send email, or has no `MAIL_APP_URL` (password reset unavailable)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /api/v1/password-reset/confirm:
    post:
      tags: [auth]
      operationId: confirmPasswordReset
      summary: Choose a new password using a single-use reset link
      description: |
        Public credential exchange: the reset token authorizes only this operation, never
        bearer-authenticated API calls. Send it in the JSON body, not the URL. A valid token is
        checked before the password is validated. Expired, used, malformed and unknown tokens,
        deleted accounts, and tokens predating a password or email change all answer one uniform
        `401`. Consumption of the token, the password replacement and the credential-generation
        advance commit atomically; concurrent confirmations cannot both succeed, including with
        different links for one account. A password the rules refuse (`400`) does not consume the
        token. Success invalidates every access and refresh session of the account and any pending
        MFA challenge. It also lifts the account's sign-in lockout (a held failure counter or lock of
        any cause) and its escalation level, since the link proves the mailbox that receives the
        sign-in codes. There is no automatic sign-in: sign in normally, with the MFA code if it is
        enabled. A best-effort confirmation email contains neither password nor token; a delivery
        failure does not undo the reset. Rate-limited to 10 requests per minute per client IP. A
        lost success response can make a retry answer `401`: try signing in with the chosen
        password, or request another link. A link issued earlier still works if outbound mail is
        later disabled.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetConfirmRequest' }
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Password replaced and existing sessions revoked; sign in again
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List users (management view)
      description: |
        ADMIN only — the whole management surface is admin-gated; regular users keep only
        their self password change.

        Supports offset pagination, sorting and filtering.

        - Sortable fields: `id`, `name`, `email` (deliberately not `roles` — a set has no
          order). Default sort is `id` ascending; `id` ascending is always appended as a
          deterministic tiebreaker.
        - Filters (optional, whitelisted):
          - `name` / `email` — case- and accent-insensitive substring matches.
          - `role` — `ADMIN` (holders of the additional role) or `USER` (plain users).
          - `feature` + `featureEnabled` — feature-flag state (the pair must come
            together, `400` otherwise; `featureEnabled` is a strict boolean).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: name
          in: query
          required: false
          schema: { type: string }
        - name: email
          in: query
          required: false
          schema: { type: string }
        - name: role
          in: query
          required: false
          schema: { type: string, enum: [ADMIN, USER] }
        - name: feature
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Feature' }
          description: Feature-flag state filter — must be paired with `featureEnabled` (400 otherwise).
        - name: featureEnabled
          in: query
          required: false
          schema: { type: boolean }
          description: Strict boolean — only users with `feature` enabled (true) or disabled (false).
      responses:
        '200':
          description: A page of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [users]
      operationId: createUser
      summary: Create a user
      description: |
        ADMIN only. The initial password is CLIENT-generated (the SPA's 96-bit generator) and
        shown to the admin exactly once — the server stores only the bcrypt hash and no
        response ever carries plaintext. The email is canonicalized (trimmed + lowercased);
        a duplicate among active accounts is a `409` (a soft-deleted account frees its email).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '201':
          description: Created
          headers:
            Location:
              schema: { type: string }
              description: URL of the new user resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Validation error (blank/too-long name or email, password rules)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/directory:
    get:
      tags: [users]
      operationId: searchUserDirectory
      summary: Look up active users (user picker)
      description: |
        ANY signed-in user — deliberately not the ADMIN-only management list (`GET /users`, which stays
        unchanged). Any user may be asked to take a DACI role (Driver, Approver, Contributor, Informed), and
        needs somebody to pick, so this returns the minimum a picker needs: `{id, name, email}` of ACTIVE users (soft-deleted accounts are absent). Roles,
        feature flags and language are never exposed; the email tells namesakes apart.

        It is the one read that lets a regular user list accounts. The bounds slow and audit a bulk
        harvest; they do not prevent one by a signed-in insider (the disclosure is accepted):
        `q` is REQUIRED and needs at least 2 characters, a page holds at most 20 rows, and the
        endpoint rides a per-USER rate bucket of 120 per minute (`429` beyond it).

        Supports offset pagination, sorting and one free-text filter.

        - `q` — case- and accent-insensitive substring match on name OR email. It is trimmed
          before the limits apply; 2 to 100 characters (code points) after trimming, `400` otherwise
          (a missing or blank `q` included).
        - `pageSize` — 1 to 20 (default 20), `400` beyond.
        - Sortable fields: `name` (default) and `id`; `id` ascending is always appended as a
          deterministic tiebreaker.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/DirectoryPageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Q'
      responses:
        '200':
          description: A page of active users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDirectoryPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [users]
      operationId: getUser
      summary: Fetch a user
      description: Target user or ADMIN (guard-before-read — an unauthorized caller 403s uniformly).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [users]
      operationId: updateUser
      summary: Update a user's name, email, and roles
      description: |
        ADMIN only. The password is deliberately not writable here (it has its own endpoint).
        Demoting the LAST active administrator is the typed `409` `urn:hammurabi:problem:last-administrator` — the management surface must stay
        reachable. An email already used by another active account is also a `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204': { description: Updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [users]
      operationId: deleteUser
      summary: Delete a user
      description: |
        ADMIN only, soft delete: the account can no longer sign in, outstanding refresh
        tokens die (`user_gone`), the email is freed for reuse, and what the user wrote or created (ADRs, discussion
        entries, lenses, history events) stays with a deleted-account marker. Deleting YOURSELF is a `403`; deleting the LAST
        active administrator is the typed `409` `urn:hammurabi:problem:last-administrator`.
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not ADMIN, or attempted to delete their own account
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/{id}/features:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [users]
      operationId: setUserDisabledFeatures
      summary: Replace a user's disabled-feature set (ADMIN only)
      description: |
        Per-user feature flags: a **wholesale replace** of the target user's DISABLED set —
        an empty array re-enables everything (idempotent, a same-set re-PUT is `204` again).
        **ADMIN-only**; changing one's OWN flags is allowed (the users routes themselves are
        never feature-gated, so an admin can always find their way back). `MFA` is the one
        inverted-default flag: users start with it in the disabled set, and a set omitting it
        — the empty "re-enable everything" array included — ENABLES the login second factor.
        The set rides the JWT, so a change takes effect at the target's next token refresh
        (≤15 min) or login. Audited as `user.features_changed` on an actual change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserFeaturesUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204': { description: Disabled-feature set replaced }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/{id}/language:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [users]
      operationId: setUserLanguage
      summary: Set a user's language (target user or ADMIN)
      description: |
        The ONE synced per-user language: it drives the UI at sign-in (rides `LoginResponse`,
        applied by the SPA on login/MFA/refresh) and the language of every email sent to the
        user (read fresh at send time, so a change takes effect immediately for emails; the
        UI picks it up at the next sign-in or token refresh). **Target user or ADMIN** — the
        header language switcher is the self-service writer (switching while signed in also
        saves here); an admin may fix a mis-set language. Idempotent (a same-value re-PUT is
        `204` again); an unsupported code is `400`. Audited as `user.language_changed` on an
        actual change. Set initially at create (`UserCreateRequest.language`, default `en`);
        the whole-user PUT deliberately never touches it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLanguageUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204': { description: Language set }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the target user and not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/{id}/password:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [users]
      operationId: changeUserPassword
      summary: Change a user's password
      description: |
        Sets a new password for the user (minimum 10 characters). Only the password is
        changed; no other fields are touched. Requires the caller to be the target user,
        or to be ADMIN. When the caller changes their OWN password (even an admin),
        `currentPassword` is required and must match; an admin resetting another user's
        password omits it. A successful change invalidates all outstanding refresh tokens
        and pending MFA challenges, including changes within the same clock second
        (already-issued access tokens expire naturally within their TTL).

        Rides a per-USER rate bucket of 5 per minute (`429` beyond it; the bucket is spent before the
        guards run). A wrong `currentPassword` on a self change also counts as a failed sign-in
        attempt toward the account's login lockout (the same counter `POST /login` and `POST /login/mfa`
        feed, `LOGIN_LOCKOUT_THRESHOLD`): once the account is locked, a self change is refused with the
        lockout's `429` - even with the correct current password, and before it is checked - exactly as
        `POST /login` is, until the lockout window ends. A missing `currentPassword` is a `403` that does
        not count. An admin resetting ANOTHER user's password verifies nothing, so it neither counts nor
        is refused by the target's lockout.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204': { description: Password updated }
        '400':
          description: New password shorter than 10 characters or longer than 71 UTF-8 bytes
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the target user and not ADMIN, or the required current password is missing/incorrect
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/teams:
    get:
      tags: [teams]
      operationId: listTeams
      summary: List teams
      description: |
        Any authenticated user — teams are a flat, shared registry;
        every mutation is ADMIN only.

        - Sortable fields: `id`, `name`, `createdAt`, `updatedAt`. Default `id` ascending.
        - Filters: `name` (case- and accent-insensitive substring).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: name
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: A page of teams
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [teams]
      operationId: createTeam
      summary: Create a team
      description: |
        ADMIN only (guarded before the body decodes — a non-admin's malformed body is still
        403). A case-insensitive name clash with an active team is `409`. An optional manager (a
        user; being a manager grants no write rights on the team yet) must be an active
        user (`400` otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamCreateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '201':
          description: Created; `Location` points at the new team
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/teams/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [teams]
      operationId: getTeam
      summary: Get a team
      description: Any authenticated user.
      responses:
        '200':
          description: The team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [teams]
      operationId: updateTeam
      summary: Rename / re-describe a team, set its manager
      description: "ADMIN only, guard before the id lookup (uniform 403). A full replace: an omitted `managerId` clears the manager; a set one must be an active user (`400` otherwise). A case-insensitive name clash with another active team is `409`. No `X-Expected-Revision`: the last write wins (two admins saving the same team at once is not detected, the later PUT replaces the earlier)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Updated
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [teams]
      operationId: deleteTeam
      summary: Delete a team (soft)
      description: ADMIN only, guard before the id lookup. Soft delete — the name is freed for reuse.
      responses:
        '204':
          description: Deleted
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/tag-categories:
    get:
      tags: [tags]
      operationId: listTagCategories
      summary: The tag registry
      description: |
        Any authenticated user (the ADR editor's tag picker and the Tags page). Every active category with its live tags - a bounded,
        admin-curated set, so the plain `{items}` wrapper, name-ordered case-insensitively.
      responses:
        '200':
          description: The categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagCategoryList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [tags]
      operationId: createTagCategory
      summary: Create a tag category
      description: |
        `ADMIN` only (guarded before the body decodes). A name (1-60 characters, single line, unique among active categories
        case-insensitively: a clash is `409`), an optional description (at most 500) and 1-100 tags. A tag name is trimmed, whitespace runs are
        collapsed and it is lower-cased; 1-40 characters of letters and digits with spaces and `. _ / + # : -` inside; each once (`400`
        otherwise). A tag lives in exactly ONE category: one a live category already holds is `409` naming its owner; one retired earlier is
        revived (the ADRs that kept it show it live again). At most 100 categories (`400`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagCategoryRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '201':
          description: Created; `Location` points at the new category
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagCategory'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/tag-categories/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [tags]
      operationId: updateTagCategory
      summary: Replace a tag category
      description: |
        `ADMIN` only, guard before the header, the body and the id lookup (uniform `403`). A full replace of the name, description and tag list,
        under the same rules as the create, and under `X-Expected-Revision` (REQUIRED: the `revision` of the category the admin loaded; a
        stale one is `409` `urn:hammurabi:problem:revision-conflict`, so two admins never silently overwrite each other's tag list). Every
        PUT bumps the revision. A tag dropped from the list is RETIRED, not erased: ADRs that carry it keep showing it as retired, and a write
        that still carries it is `400`. A missing category is `404` even when the payload claims a tag another category holds (existence
        comes before the revision). Moving a tag to another category is two saves (drop it from the first, then add it to the second); a
        name clash with another active category is `409`.
      parameters:
        - $ref: '#/components/parameters/ExpectedRevision'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagCategoryRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Replaced
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [tags]
      operationId: deleteTagCategory
      summary: Delete a tag category (soft)
      description: |
        `ADMIN` only, guard before the header and the id lookup. Soft delete under `X-Expected-Revision` (REQUIRED; a stale one is `409`
        `urn:hammurabi:problem:revision-conflict`: the admin confirmed deleting a tag list that has changed since): the name is freed for
        reuse and the category's tags are retired (ADRs that carry them keep showing them as retired until a tag write drops them).
      parameters:
        - $ref: '#/components/parameters/ExpectedRevision'
      responses:
        '204':
          description: Deleted
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/adrs:
    get:
      tags: [adrs]
      operationId: listAdrs
      summary: List ADRs
      description: |
        Any authenticated user - ADRs are an open decision log.

        Supports offset pagination, sorting and filtering.

        - Sortable fields: `id`, `number`, `name`, `updatedAt`, `status` (in lifecycle order, not alphabetically) and `relevance` (the full-text
          rank, higher first with `-relevance`; `400` without `text`). The default sort is `number` descending (newest first), or, with
          `text`, `-relevance,-number` (most relevant first, newest among equals); `id` ascending is always appended as a deterministic tiebreaker.
        - Filters (optional, whitelisted, all combinable: every one is an AND):
          - `status` - repeatable, any-of (`status=ACTIVE&status=IN_REVIEW`), at most one per status; an unknown value is `400`.
          - `q` - case- and accent-insensitive substring of the name OR the key (`0042`, `adr-0042`), at most 100 characters.
          - `text` - FULL-TEXT search (0.5.0), distinct from `q`: the name (weight A), the problem and the decision (B), the context,
            the alternatives and the consequences (C), case- and accent-insensitive ("zolw" finds "Zolw"), every word must match, a word of
            three characters or more matches as a prefix. 2 to 100 characters (code points) after trimming with at least one letter or digit
            (`400` otherwise; a blank value is no search). The rows then carry `match` (the name with its hits marked and a body snippet, as
            plain-text segments - never markup). A search runs under a deadline (`search.timeoutSeconds`) and a process cap: `429` of type
            `urn:hammurabi:problem:search-timeout` or `urn:hammurabi:problem:search-busy`, both with `Retry-After`. `pageSize` is at most 20
            with `text`. The term is never logged.
          - `participantId` - a user id: the ADRs that user holds a role on; `participantRole` narrows it to one DACI role (`400` without `participantId`).
          - `tag` - repeatable, any-of (`tag=data&tag=security`). At most 20 distinct names after trimming, collapsing whitespace and
            lower-casing. A malformed name is `400`. An unregistered name matches nothing (a retired tag still matches the ADRs that kept it).
          - `createdFrom` / `createdTo` and `updatedFrom` / `updatedTo` - inclusive UTC days (`YYYY-MM-DD`) on the creation and last-change
            times; a malformed or impossible date, or a `...From` after its `...To`, is `400`.
          - `expiresBefore` - a day (`YYYY-MM-DD`): the ADRs with an expiry date strictly before it (any status; an ADR with no expiry date never matches).
          - `hasOpenIssues` - `true` keeps the ADRs with an open issue or escalation (`openIssueCount > 0`), `false` the others.
          - `hasPredecessor` - `true` keeps the ADRs that replace another (a live predecessor), `false` the others.
          - `hasSuccessor` - `true` keeps the ADRs that have a successor (pending, or the one that replaced them; never one cancelled or withdrawn before it activated, and never a pending one whose predecessor was since cancelled, withdrawn or expired), `false` the others.
          A saved combination of these is a lens (`/lenses`): the lens's `filters` use exactly these names.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/AdrFilterStatus'
        - $ref: '#/components/parameters/OptionalQ'
        - $ref: '#/components/parameters/AdrFilterParticipantId'
        - $ref: '#/components/parameters/AdrFilterParticipantRole'
        - $ref: '#/components/parameters/AdrFilterTag'
        - $ref: '#/components/parameters/SearchText'
        - $ref: '#/components/parameters/AdrFilterCreatedFrom'
        - $ref: '#/components/parameters/AdrFilterCreatedTo'
        - $ref: '#/components/parameters/AdrFilterUpdatedFrom'
        - $ref: '#/components/parameters/AdrFilterUpdatedTo'
        - $ref: '#/components/parameters/AdrFilterExpiresBefore'
        - $ref: '#/components/parameters/AdrFilterHasOpenIssues'
        - $ref: '#/components/parameters/AdrFilterHasPredecessor'
        - $ref: '#/components/parameters/AdrFilterHasSuccessor'
      responses:
        '200':
          description: A page of ADRs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdrPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429':
          description: >-
            A search (`text`) outran its deadline (`urn:hammurabi:problem:search-timeout`, `Retry-After` 2) or the process already runs its
            maximum of searches (`urn:hammurabi:problem:search-busy`, `Retry-After` 1).
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [adrs]
      operationId: createAdr
      summary: Raise an ADR
      description: |
        Any authenticated user; the caller becomes the Driver. Only `problem` is required: a missing `name` defaults to the first
        line of the problem (cut to 120 characters). The ADR starts in `PROBLEM_RAISED`; its number is the next one of the global
        gapless counter (`key` = `ADR-` + the number zero-padded to four digits). Optional `participants` (never a Driver and never the
        caller) must be active users (`400` otherwise). A name already used by an active ADR (compared case- and accent-insensitively)
        is `409`. Records a `CREATED` event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdrCreateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '201':
          description: Created; `Location` points at the new ADR
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdrResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/adrs/export:
    get:
      tags: [adrs]
      operationId: exportAdrs
      summary: Export the matching ADRs as a ZIP of Markdown files
      description: |
        Any authenticated user (ADRs are an open decision log). A download, not a page: `application/zip` with one adr-tools Markdown file
        per matching ADR (`ADR-0042-use-postgresql.md`) and an `index.md` listing them in number order. It takes the list's FILTERS with the
        same names and the same validation (`status`, `q`, `text`, `participantId`, `participantRole`, `tag`, the created/updated day ranges,
        `expiresBefore`, `hasOpenIssues`, `hasPredecessor`, `hasSuccessor`; every one an AND); `text` is allowed and runs under the search's deadline
        and process cap like the list (`429`, `Retry-After`). It takes no `page`, `pageSize` or `sort` (the files are always in number order).
        A filter matching more than 500 ADRs (`adrs.export.maxAdrs`) is `400` - narrow it; nothing is truncated silently. At most
        `adrs.export.maxConcurrent` (2) bulk exports stream per process: the next is `429` `urn:hammurabi:problem:export-busy` with `Retry-After`. `HEAD` is `405`. No match is a `200` archive holding only
        `index.md`. The archive is streamed: every refusal comes before the first byte, a failure after it aborts the connection (the client's
        download fails; it never receives a finished archive with files missing). Rate limit:
        the per-user `export` bucket, 20 per minute, shared with the single-ADR export. Audited as `adr.exported_bulk` (ids and count only).
      parameters:
        - $ref: '#/components/parameters/AdrFilterStatus'
        - $ref: '#/components/parameters/OptionalQ'
        - $ref: '#/components/parameters/SearchText'
        - $ref: '#/components/parameters/AdrFilterParticipantId'
        - $ref: '#/components/parameters/AdrFilterParticipantRole'
        - $ref: '#/components/parameters/AdrFilterTag'
        - $ref: '#/components/parameters/AdrFilterCreatedFrom'
        - $ref: '#/components/parameters/AdrFilterCreatedTo'
        - $ref: '#/components/parameters/AdrFilterUpdatedFrom'
        - $ref: '#/components/parameters/AdrFilterUpdatedTo'
        - $ref: '#/components/parameters/AdrFilterExpiresBefore'
        - $ref: '#/components/parameters/AdrFilterHasOpenIssues'
        - $ref: '#/components/parameters/AdrFilterHasPredecessor'
        - $ref: '#/components/parameters/AdrFilterHasSuccessor'
      responses:
        '200':
          description: The archive
          headers:
            Content-Disposition:
              description: '`attachment; filename="adr-export-YYYY-MM-DD.zip"`'
              schema: { type: string }
          content:
            application/zip:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429':
          description: >-
            The per-user export bucket is empty, or the process already streams its maximum of bulk exports
            (`urn:hammurabi:problem:export-busy`, `Retry-After` 5), or a search (`text`) outran its deadline
            (`urn:hammurabi:problem:search-timeout`, `Retry-After` 2) or the process already runs its maximum of searches
            (`urn:hammurabi:problem:search-busy`, `Retry-After` 1).
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/adrs/overview:
    get:
      tags: [adrs]
      operationId: getAdrOverview
      summary: The decision log
      description: |
        Any authenticated user (ADRs are an open decision log). ONE purpose-built read, outside the paged envelope: a page cannot show
        "what is in force by tag", "what was decided lately", "what expires soon" and "what waits for a decision" together. It takes no
        parameters, and EVERY section is capped and says how many ADRs it left out (`more`, `total - items.length`, never negative) -
        the shape exception is recorded in `list-endpoints.md`. Built from a constant number of statements in one transaction.

        - `counts`: every status in lifecycle order, zero included (live ADRs only).
        - `inForce`: the ACTIVE ADRs. `categories` group them by tag category, then by LIVE tag (alphabetical, case-insensitive); an ADR is
          listed under each of its live tags, newest number first, at most 20 per tag (`more` = the rest); at most 100 tags are shown
          (`hiddenTags` counts those left out). A category or tag with no ACTIVE ADR is absent. `untagged` holds the ACTIVE ADRs with no live
          tag (a retired tag does not group an ADR), at most 20.
        - `recentlyDecided`: the 10 ADRs that became ACTIVE most recently and are still ACTIVE (`statusChangedAt` is the activation).
        - `expiringSoon`: ACTIVE ADRs whose expiry date (the LAST day in force) is within `days` days of today (UTC), soonest first, at most
          20; a date already past that the sweep has not acted on is included (it leads). `days` is `adrs.overview.expiringSoonDays` (30).
        - `awaitingDecision`: ADRs IN_REVIEW, the longest-waiting first, at most 20, each with its Approver and `mine` (the caller IS the
          Approver); `mineTotal` counts ALL the caller's, including any beyond the cap (the list filters `status=IN_REVIEW&participantId=<me>&participantRole=APPROVER` show them).

        Rows link to the ADR (`/adrs/{id}`); the sections' "more" links are the list's own filters (`status`, `tag`). No rate bucket (like
        `GET /adrs`: bounded, one call per page load); not audited (a read).
      responses:
        '200':
          description: The decision log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdrOverview'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/adrs/my-work:
    get:
      tags: [adrs]
      operationId: getAdrMyWork
      summary: The caller's ADR work
      description: |
        Any authenticated user. A personal, purpose-built read over the ADRs where the caller currently holds a DACI role. Administrators
        see only their own participant rows too. Each of the four sections returns at most 12 rows and carries `hasMore`; this bounded
        shape exception is recorded in `list-endpoints.md`. `participantRole` narrows every section to one exact DACI role.

        `actions` contains work assigned to the caller by their role: review and active validity for the Approver, returned or stalled
        drafting for the Driver, and open active escalations for either lead. `watching` contains the same attention signals on the caller's
        other participating ADRs. Drafting stalls after 14 days without a content edit or workflow move; review stalls after 7 days.
        Expiry reuses the notification reminder horizon and disappears when reminders are disabled. It also keeps an overdue `ACTIVE` ADR
        visible until the expiry sweep moves it, while the reminder job itself only mails dates from today onward. `activity` is the newest
        seven days of document, expiry, lifecycle, discussion and successor history; participant and tag fan-out is omitted. `adrs` is the
        caller's non-terminal ADRs, ordered by the same curated activity. `RETURNED` means somebody other than the Driver sent the ADR
        back from review to drafting; a Driver pulling their own ADR back is ordinary drafting and ages into `STALLED_DRAFT`.

        Rides a per-USER rate bucket of 120 per minute (`429` beyond it).
      parameters:
        - $ref: '#/components/parameters/AdrMyWorkRole'
      responses:
        '200':
          description: The caller's ADR work
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdrMyWork' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/adrs/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [adrs]
      operationId: getAdr
      summary: Get an ADR
      description: |
        Any authenticated user. Besides the record and its participants the answer carries what THIS caller may do now, so the client
        renders buttons without re-deriving the DACI rules: `allowedTransitions` (the lifecycle map minus the moves only the system
        makes, filtered by the caller's role), `canEditContent`, `canEditExpiry`, `canManageParticipants`, `canChangeApprover`, `canEditTags`, `canEditSuccessor`, `canDetachSuccessor` and `canAcceptSuccessor`. It also carries the tags and
        both ends of the successor link (`supersedes`, `supersededBy`, each with its `...Accepted` flag).
      responses:
        '200':
          description: The ADR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdrResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [adrs]
      operationId: updateAdr
      summary: Edit an ADR (content and expiry date)
      description: |
        A FULL REPLACE of the document under `X-Expected-Revision` (an omitted Markdown field is empty, an omitted `expiresOn` clears
        the date). Guard order: the ADR must exist (`404`); the caller must hold an editing role on it - the Driver, a Contributor,
        the Approver or `ADMIN` - else `403`, before the header and the body are read; then the header (`400`) and the body (`400`).
        Under the lock the service then judges, in this order: a terminal ADR is `409` `urn:hammurabi:problem:adr-frozen`; a stale revision
        is `409` `urn:hammurabi:problem:revision-conflict` (before any per-field judgement, so a stale save is never a false `403`); a
        CONTENT change (name, problem, context, decision, alternatives, consequences) is `409` `adr-frozen` once the ADR is `ACTIVE`, and
        `403` for anyone but the Driver, a Contributor or `ADMIN`; an expiry change is `403` for anyone but the Driver, the Approver or
        `ADMIN` - and, once the ADR is `ACTIVE` (the decision is in force), for anyone but the Approver or `ADMIN` - and `400` when the
        new date is in the past. A save that changes nothing is `204` and records nothing (no revision bump, no event); a real change
        bumps the revision and records one `UPDATED` event listing the changed fields (Markdown fields by name only, `name` and
        `expiresOn` with their old and new value). A changed or removed expiry date of an `ACTIVE` ADR also notifies its participants
        (`EXPIRY_CHANGED`, the actor excepted).
      parameters:
        - $ref: '#/components/parameters/ExpectedRevision'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdrUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Saved (or nothing to save)
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [adrs]
      operationId: deleteAdr
      summary: Delete an ADR (soft)
      description: |
        `ADMIN` only, guard before the id lookup (uniform `403`). Soft delete: the ADR stops reading as active and frees its name, but
        keeps its number (numbers are never reused). A second delete is `404`.
      responses:
        '204':
          description: Deleted
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/adrs/{id}/transitions:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [adrs]
      operationId: transitionAdr
      summary: Move an ADR through its lifecycle
      description: |
        The lifecycle map: `PROBLEM_RAISED` to `SOLUTION_DRAFT`, `IN_REVIEW` or `CANCELLED`; `SOLUTION_DRAFT` to `IN_REVIEW` or `CANCELLED`;
        `IN_REVIEW` to `SOLUTION_DRAFT` (send back), `ACTIVE`, `CANCELLED` or `WITHDRAWN`; `ACTIVE` to `WITHDRAWN` (the decision is revoked),
        `EXPIRED` or `SUPERSEDED`, the last two of which only the system requests (the expiry sweep, a successor's activation) - a user
        asking for them gets the same `409`. Who: the Driver (or `ADMIN`) moves to `SOLUTION_DRAFT` (from `PROBLEM_RAISED`), `IN_REVIEW` and
        `CANCELLED`; the Approver (or `ADMIN`) to `ACTIVE` and `WITHDRAWN` (from `IN_REVIEW` or `ACTIVE`); the SEND BACK (`IN_REVIEW` to
        `SOLUTION_DRAFT`) is the Approver's or the Driver's (or `ADMIN`'s). A sent-back ADR goes back to drafting: it keeps its content, participants and tags, the Approver
        must review it again, and the next move to `IN_REVIEW` re-checks the required fields. A withdrawn ADR is terminal; a successor linked to a
        withdrawn predecessor cannot be activated until the link is removed.
        Cancelling, withdrawing or expiring (the sweep) an ADR that has a PENDING successor (one still pre-active, set to replace it) ALSO
        records a `PREDECESSOR_ENDED` event on that successor in the same transaction and
        notifies the successor's Driver and Approver (`PREDECESSOR_ENDED`, the actor excepted); the successor keeps its link, its revision does not
        move, and from then on the ended ADR no longer lists it as `supersededBy`.

        The optional `reason` (free text, at most 1000 code points) is kept in the `TRANSITIONED` event and shown in the history; it is
        accepted on every move, asked for by the send back and the withdrawal, and never reaches a notice or an email.

        Guard order: the ADR must exist (`404`); the caller must be the Driver, the Approver or `ADMIN`, else `403`, before the header and
        body are read; then the header (`400`) and the body (`400`, `to` is a status name). Under the lock: the caller's role for the
        MOVE (`403`), the lifecycle map (`409` `urn:hammurabi:problem:illegal-transition`), the stale revision (`409`
        `urn:hammurabi:problem:revision-conflict`), a successor over a decision in force that its Approver has not accepted (`409`
        `urn:hammurabi:problem:successor-not-accepted`: when the ADR replaces an `ACTIVE` one, `ADMIN` included, until
        `POST /adrs/{id}/successor/accept` on that predecessor), then the `reason` (`400`: control characters, over 1000 code points) and the target's
        requirements (`400` naming the missing fields): entering `IN_REVIEW` or
        `ACTIVE` needs `context`, `decision`, `consequences` and an Approver, and entering `ACTIVE` an expiry date not in the past and - when the
        ADR replaces another one (`supersedes`) - that predecessor being `ACTIVE` (else `400` naming it: unlink it first). Bumps the revision and
        records a `TRANSITIONED` event. Activating a successor ALSO moves the `ACTIVE` ADR it replaces to `SUPERSEDED` in the same
        transaction (both rows locked in id order): the predecessor's revision bumps and it gets a `SUPERSEDED` event, the successor a
        `SUCCESSOR_ACTIVATED` one, both with the activating user as the actor. Answers the ADR as the caller now sees it.
      parameters:
        - $ref: '#/components/parameters/ExpectedRevision'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdrTransitionRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: The ADR after the move
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdrResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/adrs/{id}/participants:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [adrs]
      operationId: replaceAdrParticipants
      summary: Replace an ADR's DACI participants
      description: |
        A wholesale replace of the participant set: exactly ONE Driver (the role can be handed over, never left empty), at most one
        Approver, any number of Contributors and Informed, each user once, at most 100 in all (`400` otherwise). A user new to the set (or
        taking a new role) must be an active user (`400`). Who: the Driver, the Approver or `ADMIN`, else `403` before the header and the
        body are read. The Approver seat has two further `403` rules, judged under the row lock: nobody but `ADMIN` can name THEMSELVES the
        Approver (unless they already are), at any status, before the terminal `409`, the revision and the `400`s of the body; and once the
        ADR has EVER been in review (`IN_REVIEW`, `ACTIVE`, or a draft again after a send back) only the current Approver or `ADMIN` can add,
        remove or replace the Approver (a PUT that leaves the seat as it is, such as a Driver handover, is not judged), judged against the
        stored set after the terminal `409` and the stale revision, so a stale editor that did not touch the seat is a `409`, never a
        false `403`. `canChangeApprover` on the ADR serves the second rule. The write is guarded by `X-Expected-Revision` exactly like the document PUT (REQUIRED: missing or malformed is
        `400`, a stale one `409` `urn:hammurabi:problem:revision-conflict`), so a stale editor cannot silently drop people another
        editor added. A terminal ADR is `409` `urn:hammurabi:problem:adr-frozen` (checked before the revision). The change is applied as
        a diff and records one `PARTICIPANT_ADDED`, `PARTICIPANT_REMOVED` or `PARTICIPANT_CHANGED` event per participant; a real change
        bumps the ADR's `revision` (and `updatedAt`), a set that changes nothing is `204`, bumps nothing and records nothing.
      parameters:
        - $ref: '#/components/parameters/ExpectedRevision'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdrParticipantsRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Replaced (or already so)
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/adrs/{id}/tags:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [adrs]
      operationId: replaceAdrTags
      summary: Replace an ADR's tags
      description: |
        A wholesale replace of the tag set, applied as a diff: at most 20 distinct tag names (trimmed, whitespace runs collapsed,
        lower-cased), each a LIVE tag of the registry - an unregistered or retired one is `400` listing it, so a save that keeps a tag the
        registry has since dropped is refused until the tag is removed from the set. An empty list clears the tags. Who: the Driver, the
        Approver or `ADMIN`, else `403` before the header and the body are read. Tags are not part of the content freeze: an `ACTIVE` ADR
        takes them; a terminal ADR is `409` `urn:hammurabi:problem:adr-frozen` (checked before the revision). Guarded by
        `X-Expected-Revision` (REQUIRED; a stale one is `409` `urn:hammurabi:problem:revision-conflict`). A real change bumps the revision and
        records one `TAGS_CHANGED` event; a set that changes nothing is `204`, bumps nothing and records nothing.
      parameters:
        - $ref: '#/components/parameters/ExpectedRevision'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdrTagsRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Replaced (or already so)
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/adrs/{id}/supersedes:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [adrs]
      operationId: setAdrSupersedes
      summary: Set or remove the ADR this one replaces
      description: |
        Links THIS ADR (the successor) to the ADR it replaces (`supersedesId`); an omitted or null `supersedesId` removes the link. The link
        takes effect when this ADR becomes `ACTIVE`. Who: the Driver, the Approver or `ADMIN` of THIS ADR, else `403` before the header and the
        body are read. Under the lock, in order: a terminal ADR is `409` `urn:hammurabi:problem:adr-frozen`; a stale revision is `409`
        `urn:hammurabi:problem:revision-conflict`; an `ACTIVE` ADR is `409` `adr-frozen` (the link is set before the decision is in force);
        then the predecessor: it must be another live ADR (`400`), not terminal (`400`: only an `ACTIVE` or a pre-active ADR can be replaced),
        must not close a cycle (`409`) and must have no other successor in play (`409`; a cancelled or withdrawn one does not count). A
        real change bumps the revision and records `SUCCESSOR_UNLINKED` (the old end) and `SUCCESSOR_LINKED` (the new one); the same link
        again is `204` and records nothing. A link is only a proposal until the predecessor's Approver accepts it
        (`POST /adrs/{id}/successor/accept`, needed to activate over an `ACTIVE` predecessor); any change of the link (a re-point, a removal)
        voids an acceptance, and the same link again keeps it.
      parameters:
        - $ref: '#/components/parameters/ExpectedRevision'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdrSupersedesRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Linked, unlinked (or already so)
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/adrs/{id}/successor:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    delete:
      tags: [adrs]
      operationId: detachAdrSuccessor
      summary: Detach this ADR's pending successor
      description: |
        The PREDECESSOR's owner removes the successor that is set to replace THIS ADR but has not activated yet (linking is the successor's
        write, so without this a stranger could park a link on an ADR and block everyone else). Who: the Driver, the Approver or `ADMIN` of
        THIS ADR (the predecessor; the successor's roles do not matter), else `403` before anything else. No header and no body. An optional
        `successorId` query guard names the pending successor the caller saw, so a link replaced since confirmation is `404` instead of
        detaching the replacement; omitting it preserves the original client contract. The service judges the link under its locks. In order:
        a terminal ADR is `409` `urn:hammurabi:problem:adr-frozen` (a successor that already activated superseded it), then no matching pending
        successor is `404`. A detach
        clears the successor's `supersedesId` (and with it any acceptance), bumps the SUCCESSOR's revision (its open editors and a racing
        activation conflict), leaves this ADR's revision alone and records `SUCCESSOR_UNLINKED` on both ADRs.
      parameters:
        - name: successorId
          in: query
          required: false
          schema: { type: integer, format: int32, minimum: 1 }
          description: The pending successor seen by the caller; a different current successor is `404`. Omit for legacy blind detach.
      responses:
        '204':
          description: Detached
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/adrs/{id}/successor/accept:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [adrs]
      operationId: acceptAdrSuccessor
      summary: Accept this ADR's pending successor
      description: |
        The PREDECESSOR's Approver (or `ADMIN`) consents to the successor that is set to replace THIS decision in force, which the
        successor's activation needs (`urn:hammurabi:problem:successor-not-accepted` otherwise). Who: the Approver or `ADMIN` of THIS ADR (the
        predecessor; the Driver's role does not count, and neither does any role on the successor), else `403` before the body is read.
        Order: the ADR must exist (`404`), the caller's role (`403`), the body (`400`), then under the link lock and both rows: a terminal
        ADR is `409` `urn:hammurabi:problem:adr-frozen`; an ADR that is not yet `ACTIVE` is a plain `409` (nothing to accept before the
        decision is in force); a pending successor that is not `successorId` (none, another, one already activated or cancelled) is `404`, so
        a link that was re-pointed since the caller looked is never accepted blind. A real acceptance is `204`, records
        `SUCCESSOR_ACCEPTED` on both ADRs and notifies the successor's Driver and Approver; accepting a link already accepted is `204` and
        records nothing. No revision moves, and the acceptance belongs to this link only: the successor's Driver re-pointing it, removing
        it or the owners detaching it voids it, while a hand-over of the Approver seat does not. The Approver cannot take it back: detach
        the successor instead. No header (`X-Expected-Revision` does not apply).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdrSuccessorAcceptRequest'
      responses:
        '204':
          description: Accepted (or already accepted)
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/adrs/{id}/events:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [adrs]
      operationId: listAdrEvents
      summary: An ADR's history
      description: |
        Any authenticated user. The immutable structural events of the ADR (`type` + string `params` the client renders in the viewer's
        language), committed with the write they describe. A null `actorId` is the system (the expiry sweep).

        - Sortable fields: `id`, `createdAt`. The default sort is `createdAt` descending, then `id` descending (newest first).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: A page of events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdrEventPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/adrs/{id}/export:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [adrs]
      operationId: exportAdr
      summary: Export an ADR as one Markdown file
      description: |
        Any authenticated user (every ADR is readable); a missing or soft-deleted ADR is `404`. A download: `text/markdown; charset=utf-8`
        with `Content-Disposition: attachment; filename="ADR-0042-<slug>.md"`, the slug being the name folded to ASCII (`[a-z0-9-]`, at most
        60 characters; none when the name has no Latin letter or digit). The document follows the adr-tools convention - `# 42. Name`,
        `Date:` (the day the decision was first made active, else created, UTC), `## Status` (in words, the expiry date, `Supersedes` /
        `Superseded by` links to the sibling files), `## Context` (the problem, then the context), `## Decision`, `## Consequences` - plus
        `## Alternatives considered` (only when non-empty), `## Roles (DACI)` and `## Tags`. The Markdown fields are included verbatim
        (line endings normalised, nothing escaped). Rate limit: the per-user `export` bucket, 20 per minute. Audited as `adr.exported`. `HEAD` is `405`.
      responses:
        '200':
          description: The document
          headers:
            Content-Disposition:
              description: '`attachment; filename="ADR-0042-<slug>.md"`'
              schema: { type: string }
          content:
            text/markdown:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/adrs/{id}/discussion:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [adrs]
      operationId: listAdrDiscussion
      summary: An ADR's discussion
      description: |
        Any authenticated user, in EVERY ADR status (the discussion stays readable forever). The entries of the ADR, oldest first, a
        deleted entry as a tombstone (`deleted` true, no `body`). Each entry carries THIS caller's verdicts (`canEdit`, `canDelete`,
        `canChangeState`).

        - Sortable fields: `id`, `createdAt`. The default sort is `createdAt` ascending (oldest first); `id` ascending is always appended.
        - Filters (optional, whitelisted): `kind` - repeatable, any-of (`kind=COMMENT&kind=QUESTION`), at most one per kind, an unknown value
          is `400`; `state` - one state (`OPEN`, `ANSWERED`, `RESOLVED`; a comment and a tombstone have none, so no state matches them).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: kind
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 4
            items: { $ref: '#/components/schemas/DiscussionKind' }
          description: Any-of filter on the kind; repeat the key for several.
        - name: state
          in: query
          required: false
          schema: { $ref: '#/components/schemas/DiscussionState' }
          description: Only the entries in this state.
      responses:
        '200':
          description: A page of entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscussionPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [adrs]
      operationId: postAdrDiscussionEntry
      summary: Post a comment, question, issue or escalation
      description: |
        Any authenticated user - an open decision log. The window follows the ADR's status: a `COMMENT` or `QUESTION` is accepted while the
        ADR is `PROBLEM_RAISED`, `SOLUTION_DRAFT` or `IN_REVIEW`, an `ISSUE` or `ESCALATION` only while it is `ACTIVE`; any other status is
        `409` `urn:hammurabi:problem:discussion-closed`. The body is Markdown, 1 to 10,000 characters after normalisation (`400` otherwise).
        A question, issue or escalation starts `OPEN`; a comment has no state. Records a `COMMENTED`, `QUESTION_ASKED`, `ISSUE_RAISED` or
        `ESCALATED` event in the ADR's history. Guard order: the ADR must exist (`404`), then the body (`400`), then the window (`409`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscussionCreateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '201':
          description: Posted; `Location` points at the new entry
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscussionEntry'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/adrs/{id}/discussion/{entryId}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/DiscussionEntryId'
    get:
      tags: [adrs]
      operationId: getAdrDiscussionEntry
      summary: One discussion entry
      description: Any authenticated user, in every ADR status; a deleted entry reads as its tombstone.
      responses:
        '200':
          description: The entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscussionEntry'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [adrs]
      operationId: editAdrDiscussionEntry
      summary: Edit a discussion entry
      description: |
        The AUTHOR only (`403` for anyone else, an `ADMIN` included, before the body is read). Replaces the Markdown body (1 to 10,000
        characters, `400` otherwise); the kind never changes. The same window as posting applies (`409`
        `urn:hammurabi:problem:discussion-closed` once the ADR's status no longer takes the kind). A deleted entry is `404`. Sets `editedAt`;
        the same text writes nothing. `X-Expected-Revision` is optional for v1 compatibility; when supplied, a stale entry revision is a
        typed `409` before the no-op check. A real edit increments the entry revision; the parent ADR revision is untouched. An edit is
        audit-only, not a history event. Answers the entry.
      parameters:
        - $ref: '#/components/parameters/OptionalDiscussionRevision'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscussionEditRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: The entry after the edit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscussionEntry'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [adrs]
      operationId: deleteAdrDiscussionEntry
      summary: Delete a discussion entry
      description: |
        The author or an `ADMIN` (`403` otherwise). A soft delete that leaves a TOMBSTONE: the entry stays in the list as `deleted` with no
        body, no state and no resolution (the text is wiped from the store too). Allowed in EVERY ADR status - the moderation path is never
        closed. An already deleted entry is `404`. `X-Expected-Revision` is optional for v1 compatibility; when supplied, a stale entry
        revision is a typed `409`. A delete increments the tombstone's entry revision; the parent ADR revision is untouched. Audit-only,
        not a history event.
      parameters:
        - $ref: '#/components/parameters/OptionalDiscussionRevision'
      responses:
        '204':
          description: Deleted
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/adrs/{id}/discussion/{entryId}/state:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/DiscussionEntryId'
    put:
      tags: [adrs]
      operationId: setAdrDiscussionEntryState
      summary: Answer, resolve or reopen an entry
      description: |
        Sets the entry's state (idempotent). A `QUESTION` is `OPEN` or `ANSWERED`, an `ISSUE` or `ESCALATION` is `OPEN` or `RESOLVED`; a
        `COMMENT` has no state and any other pairing is `400`. Who: for a question its author, the Driver, the Approver or `ADMIN`; for an
        issue or escalation the Driver, the Approver or `ADMIN` - else `403` before the body is read. The optional `resolution` note
        (at most 2,000 characters) travels only with `RESOLVED`; a reopen clears it. There is NO window: the state
        changes in every ADR status (an issue on an expired or superseded ADR can still be resolved). Records a `QUESTION_ANSWERED`, `QUESTION_REOPENED`, `ISSUE_RESOLVED` or `ISSUE_REOPENED`
        event when the state really changes. Setting the state the entry already has writes and records nothing, except that a `RESOLVED` entry sent
        `RESOLVED` with a different `resolution` has its note replaced (none clears it) with no event. `X-Expected-Revision` is optional
        for v1 compatibility; when supplied, a stale entry revision is a typed `409` before the no-op check. A real state or note change
        increments the entry revision; the parent ADR revision is untouched. Answers the entry.
      parameters:
        - $ref: '#/components/parameters/OptionalDiscussionRevision'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscussionStateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: The entry in its (new) state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscussionEntry'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/lenses:
    get:
      tags: [lenses]
      operationId: listLenses
      summary: List the lenses
      description: |
        Any authenticated user: the caller's OWN lenses (both visibilities) plus everyone's PUBLIC ones. Paged; sortable by `id`,
        `name` (case-insensitively, the default), `updatedAt` and `createdAt`. Filters: `mine` (`true` = only the caller's own, `false` =
        only the PUBLIC lenses of others) and `visibility`. One user keeps at most 50 lenses, so `mine=true` fits one page.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: mine
          in: query
          required: false
          schema: { type: boolean }
          description: "`true`: the caller's own lenses; `false`: the PUBLIC lenses of others."
        - name: visibility
          in: query
          required: false
          schema: { $ref: '#/components/schemas/LensVisibility' }
      responses:
        '200':
          description: A page of lenses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LensPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [lenses]
      operationId: createLens
      summary: Save a lens
      description: |
        Any authenticated user; the caller becomes the creator. A name (1-100 characters, single line) unique among the caller's own
        lenses case-insensitively (`409`), a visibility and the `filters` document, validated by the SAME rules as the list's query
        parameters (`400`; a search term is never echoed). At most 50 lenses per user (`409`). Validated structurally only: a lens
        holding a since-retired tag simply matches nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LensRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '201':
          description: Created; `Location` points at the new lens
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lens'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/lenses/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [lenses]
      operationId: getLens
      summary: Read a lens
      description: Any authenticated user. A PRIVATE lens of someone else, a missing and a deleted lens are all the same `404`.
      responses:
        '200':
          description: The lens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lens'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [lenses]
      operationId: updateLens
      summary: Replace a lens
      description: |
        Whole-lens replace (rename, flip the visibility and overwrite the filters are all this one PUT), by its CREATOR only. Disclosure
        and order: a missing, deleted or someone else's PRIVATE lens is `404`; someone else's PUBLIC lens is `403` (an ADMIN's too); only then
        is the body judged (`400`), so `403`/`404` win over `400`. A name clash among the caller's own lenses is `409`. No `X-Expected-Revision`: the last write wins (the same lens saved
        from two tabs is not detected, the later PUT replaces the earlier).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LensRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Saved
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [lenses]
      operationId: deleteLens
      summary: Delete a lens (soft)
      description: |
        By its CREATOR, or by an `ADMIN` when the lens is PUBLIC (moderation; audited with `byAdmin`). A missing, deleted or someone
        else's PRIVATE lens is `404` (an ADMIN's too: a private lens's existence is itself the secret); someone else's PUBLIC lens is `403`
        for a non-admin. The name is freed for reuse.
      responses:
        '204':
          description: Deleted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: List the caller's notifications
      description: |
        Any authenticated user: the caller's OWN notices only (there is nothing to disclose and no guard), newest first by default, on ADRs
        that still exist, of a kind this build knows. Paged; sortable by `id` and `createdAt`; `seen` filters (`false` = the unseen ones,
        the bell's badge). **The `total` is capped at 1000** (a count reads at most 1001 rows, so it never grows with a person's history;
        a page starting at or past row 1000 is empty). A notice is a pointer: the actor's name and the ADR's key and name are read when the
        page is read, so a rename shows at once. A read: no audit line. Rides the per-user `read-state` bucket (240/min, `429`).
        `.claude/docs/adr-model.md` "Notifications".
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: seen
          in: query
          required: false
          schema: { type: boolean }
          description: "`true`: the seen notices; `false`: the unseen ones; omitted: both."
      responses:
        '200':
          description: A page of the caller's notifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/notifications/seen-all:
    post:
      tags: [notifications]
      operationId: markAllNotificationsSeen
      summary: Mark every unseen notification of the caller seen
      description: |
        Any authenticated user; touches only the caller's own rows, in chunks of 1000. `204` even when none was unseen. Not audited (view
        state). Rides the per-user `read-state` bucket (`429`).
      responses:
        '204': { description: Every unseen notification of the caller is seen }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/notifications/{id}/seen:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [notifications]
      operationId: markNotificationSeen
      summary: Mark one notification of the caller seen
      description: |
        Any authenticated user. Seen again is `204`. Someone else's notice and one that does not exist are the same `404` (no `403` to probe
        with). Not audited (view state). Rides the per-user `read-state` bucket (`429`), taken before the id is looked at.
      responses:
        '204': { description: The notification is seen }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/users/{id}/notification-preferences:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [notifications]
      operationId: getNotificationPreferences
      summary: Read a user's notification switches (target user or ADMIN)
      description: |
        Every kind with its two switches: `inApp` (the bell: a switched-off kind makes no notice for the person from then on) and `email`
        (the digest: a switched-off kind is never mailed; the bell is unchanged). A kind with no stored row is on. `emailAvailable` is false
        on a deployment with no outbound email (the email switches then do nothing; the bell works). **Target user or ADMIN**: `403`
        before anything is read, then `404` for an unknown or soft-deleted user. Rides the per-user `read-state` bucket (`429`).
      responses:
        '200':
          description: The switches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the target user and not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [notifications]
      operationId: setNotificationPreferences
      summary: Replace a user's notification switches (target user or ADMIN)
      description: |
        A **wholesale replace** in the shape the GET answers: `kinds`, one `{type, inApp, email}` entry per kind. A kind left out is ON (both
        switches), so an empty array switches everything on; the last write wins (no revision), and sending the GET's own `kinds` back changes
        nothing (idempotent, a same-set re-PUT is `204` again). Order: `403` (target user or ADMIN) first, then the body (`400`: an unknown
        type, a kind listed twice), then the target (`404`). Audited as `user.notification_preferences_changed` on an actual change. It changes what is
        made or mailed from then on and deletes nothing already made. Rides the per-user `read-state` bucket (`429`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreferencesUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204': { description: Switches replaced }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the target user and not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/telemetry/current:
    get:
      tags: [telemetry]
      operationId: getTelemetryCurrent
      summary: Hammurabi's own vital signs - processes, storage, request latency
      description: |
        ADMIN only (operational data: process sizes, container limits, storage sizes), read-only, no audit event;
        both telemetry reads share one per-user rate bucket (30/min, `429`). `.claude/docs/observability.md` "Telemetry".
        `processes` lists each sampling process (role `app`) with its latest raw sample: every live process, and the
        newest stale one when none is alive (a process that stopped stays visible for a day). `stale` = no sample for more than three
        sample intervals. A figure the process could not measure is null (no container limit outside a cgroup, no `memory.peak` on an
        old kernel) - never zero; `percentOfLimit` is the cgroup working set over the container limit, in percent. `storage` is the
        newest database / per-schema size (null before the first measurement). `requests` is the latest sample interval of the live
        processes: the `*` total and the 15 busiest routes.
      responses:
        '200':
          description: The current figures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryCurrent'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/telemetry/history:
    get:
      tags: [telemetry]
      operationId: getTelemetryHistory
      summary: The trend of one telemetry section over 24 hours, 7 days or 90 days
      description: |
        ADMIN only (guard before the query is read: `403` outranks `400`), read-only, no audit event.
        `group` picks the section and `range` the span; both are required. Buckets: `24h` = the raw sample interval (widened to a whole
        multiple of it when that would exceed 400 points), `7d` = one hour (the hourly rollups plus the raw rows of the hours not yet
        rolled up), `90d` = six hours; `bucketSeconds` says which. At most 400 points per series and 40 series (`truncated` when more
        matched); a series has points only for the buckets that hold data.
        Per-process groups merge the processes of one `role` into one series, so a trend survives a restart (`memory`, `jvm`), or all
        processes into one series per route (`requests`, `role` null); `storage` is cluster-wide (`role` null). `requests` keeps the `*`
        total (count, p50, p95, 5xx, 429) and the ten busiest routes of the range (count, p50, p95). A DELTA series' `avg` is the
        bucket's TOTAL and its `max` the largest single sample interval; a GAUGE or PERCENTILE series' `avg` is the n-weighted mean and
        `max` the largest sample. `historyFrom` is the oldest instant the range can actually hold: the first sampler boot (a fresh
        install, or retention shorter than the range).
      parameters:
        - name: group
          in: query
          required: true
          schema:
            type: string
            enum: [memory, storage, requests, jvm]
          description: The panel section.
        - name: range
          in: query
          required: true
          schema:
            type: string
            enum: [24h, 7d, 90d]
          description: How far back the history reaches.
      responses:
        '200':
          description: The series
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryHistory'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      # int32: ids are 32-bit server-side; a non-numeric or out-of-range id is a 400. Ids are database sequences that
      # start at 1, so 0 never addresses anything (it answers 404, like any unknown id).
      schema: { type: integer, format: int32, minimum: 1 }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
      description: 1-based page index. Defaults to 1.
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      description: Rows per page. Defaults to 20, maximum 100.
    Sort:
      name: sort
      in: query
      required: false
      schema: { type: string }
      description: |
        Sort spec. Format: `field` (ascending) or `-field` (descending). Multiple fields are
        comma-separated, leftmost wins: `sort=-updatedAt,name`. The endpoint declares its
        sortable-field whitelist; unknown fields are rejected with `400`. `id` ascending is
        always appended as a deterministic tiebreaker.
    DirectoryPageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 20, default: 20 }
      description: Rows per page for the user directory only. Defaults to 20, maximum 20 (the shared maximum is 100).
    Q:
      name: q
      in: query
      required: true
      schema: { type: string, minLength: 2, maxLength: 100 }
      description: >-
        Free-text search (API-LIST-005), REQUIRED where declared (the user directory). Case- and accent-insensitive
        substring match; the endpoint declares which fields it searches. The value is trimmed before the length limits
        apply, so it needs 2 to 100 characters (code points) after trimming.
    OptionalQ:
      name: q
      in: query
      required: false
      schema: { type: string, maxLength: 100 }
      description: >-
        Free-text search (API-LIST-005), OPTIONAL where declared (the ADR list): a case- and accent-insensitive substring match on the
        fields the endpoint names (an ADR's name or key), at most 100 characters.
    SearchText:
      name: text
      in: query
      required: false
      schema: { type: string, maxLength: 100 }
      description: >-
        Full-text search (0.5.0), OPTIONAL where declared (the ADR list): accent- and case-insensitive, every word must match, a word of
        three characters or more as a prefix. 2 to 100 characters (code points) after trimming with a letter or a digit (`400`
        otherwise); blank is no search. Distinct from `q`, the name-or-key substring.
    AdrFilterStatus:
      name: status
      in: query
      required: false
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        maxItems: 8
        items: { $ref: '#/components/schemas/AdrStatus' }
      description: Any-of filter on the lifecycle status; repeat the key for several.
    AdrFilterParticipantId:
      name: participantId
      in: query
      required: false
      schema: { type: integer, format: int32, minimum: 0 }
      description: A user id - only the ADRs this user holds a DACI role on.
    AdrFilterParticipantRole:
      name: participantRole
      in: query
      required: false
      schema: { $ref: '#/components/schemas/AdrRole' }
      description: Narrows `participantId` to one role (`400` without `participantId`).
    AdrMyWorkRole:
      name: participantRole
      in: query
      required: false
      schema: { $ref: '#/components/schemas/AdrRole' }
      description: Narrows every personal-work section to ADRs where the caller holds this exact DACI role. A repeated key is `400`.
    AdrFilterTag:
      name: tag
      in: query
      required: false
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        maxItems: 20
        items: { type: string, minLength: 1, maxLength: 40 }
      description: Any-of filter on the ADR's tags. Repeat the key for several. The limit applies to distinct, normalized registry names.
    AdrFilterCreatedFrom:
      name: createdFrom
      in: query
      required: false
      schema: { type: string, format: date }
      description: Created on or after this UTC day.
    AdrFilterCreatedTo:
      name: createdTo
      in: query
      required: false
      schema: { type: string, format: date }
      description: Created on or before this UTC day.
    AdrFilterUpdatedFrom:
      name: updatedFrom
      in: query
      required: false
      schema: { type: string, format: date }
      description: Last changed on or after this UTC day.
    AdrFilterUpdatedTo:
      name: updatedTo
      in: query
      required: false
      schema: { type: string, format: date }
      description: Last changed on or before this UTC day.
    AdrFilterExpiresBefore:
      name: expiresBefore
      in: query
      required: false
      schema: { type: string, format: date }
      description: Expiry date strictly before this day.
    AdrFilterHasOpenIssues:
      name: hasOpenIssues
      in: query
      required: false
      schema: { type: boolean }
      description: Has (`true`) or has no (`false`) open issue or escalation.
    AdrFilterHasPredecessor:
      name: hasPredecessor
      in: query
      required: false
      schema: { type: boolean }
      description: Replaces (`true`) or does not replace (`false`) another ADR.
    AdrFilterHasSuccessor:
      name: hasSuccessor
      in: query
      required: false
      schema: { type: boolean }
      description: Has (`true`) or has no (`false`) successor in play or in effect (never one whose predecessor was cancelled, withdrawn or expired).
    DiscussionEntryId:
      name: entryId
      in: path
      required: true
      schema: { type: integer, format: int32, minimum: 1 }
      description: A discussion entry of the ADR in the path; one of another ADR is `404`.
    OptionalDiscussionRevision:
      name: X-Expected-Revision
      in: header
      required: false
      schema: { type: integer, format: int64, minimum: 1 }
      description: |
        The discussion entry revision the caller read. Optional for v1 compatibility; when present, repeated or malformed is `400` and
        stale is `409` `urn:hammurabi:problem:revision-conflict`. Checked under the ADR lock before deciding a write is a no-op.
    ExpectedRevision:
      name: X-Expected-Revision
      in: header
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
      description: |
        The revision of the document the caller read (`revision`). Missing, repeated or malformed is a `400`; a stale one is a `409`
        of type `urn:hammurabi:problem:revision-conflict`. Every successful PUT bumps the revision.
  responses:
    UnsupportedMediaType:
      description: Request body must use application/json. A missing body or Content-Type remains a 400.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Unauthorized:
      description: Missing, invalid or no longer valid token (revoked, or the account was deleted, demoted or re-credentialed since it was issued)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Forbidden:
      description: Caller is not permitted to perform this action
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Conflict:
      description: Conflict with an existing resource
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    TooManyRequests:
      description: >-
        Throttled — either the per-IP rate-limit bucket is exhausted (generic detail), on a telemetry read
        (`/api/v1/telemetry/**`) the per-USER telemetry bucket is exhausted (30/min), on the user directory
        (`/api/v1/users/directory`) the per-USER directory bucket is exhausted (120/min), on My work (`/api/v1/adrs/my-work`) the per-USER my-work bucket is exhausted (120/min), on the notification routes the per-USER
        read-state bucket is exhausted (240/min), on the ADR exports the per-USER export bucket is exhausted (20/min), on a password
        change the per-USER password-change bucket is exhausted (5/min), on any of the 13 ADR and discussion writes the per-USER adr-write
        bucket is exhausted (120/min, checked before the ADR is looked up), or, on /login, the
        per-account lockout is active (account-specific detail), or, on the ADR list's full-text `text` search, the search ran past its deadline
        (`urn:hammurabi:problem:search-timeout`) or the process's concurrent-search cap is reached (`urn:hammurabi:problem:search-busy`; both
        with `Retry-After`), or the bulk ADR export's concurrency cap is reached (`urn:hammurabi:problem:export-busy`, `Retry-After`).
        All carry a ProblemDetail body.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    PayloadTooLarge:
      description: >-
        Request body exceeds the global 10 MiB ceiling — a memory-DoS backstop shared by
        every endpoint, so declared on every operation that takes a body (field-level maxLength
        rules reject oversized values far earlier on ordinary payloads). Cross-cutting for the
        coverage gate: pinned once by `PayloadValidationTest`, never once per operation.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    InternalServerError:
      description: >-
        Unexpected server error.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: Always `ok` on a 200 — a failed probe is a problem body, never a status word.
          example: ok
    PasswordResetConfirmRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Single-use 256-bit reset credential from the email; never logged or returned.
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 71
          description: The new password; at most 71 UTF-8 bytes (bcrypt ceiling).

    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    LoginResponse:
      type: object
      required: [token, expiresAt, refreshToken, refreshExpiresAt, userId, roles, disabledFeatures, language]
      properties:
        token:
          type: string
          description: "Short-lived access token; send as the `Authorization: Bearer` value."
        expiresAt:
          type: integer
          format: int64
          description: Access-token expiry as Unix epoch milliseconds.
        refreshToken:
          type: string
          description: Longer-lived token; POST to /api/v1/refresh to obtain a fresh pair.
        refreshExpiresAt:
          type: integer
          format: int64
          description: Refresh-token expiry as Unix epoch milliseconds.
        userId: { type: integer, format: int32, minimum: 0 }
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
          description: Additional roles of the authenticated user — empty for a regular user.
        disabledFeatures:
          type: array
          items: { $ref: '#/components/schemas/Feature' }
          description: Per-user feature flags — the admin-disabled set; empty = full access.
        language:
          $ref: '#/components/schemas/Language'

    UserRole:
      type: string
      enum: [ADMIN]
      description: >-
        An additional role. Every user is implicitly a regular user; the array only ever
        carries privileges added on top of that baseline.

    Feature:
      type: string
      enum: [MFA]
      description: >-
        A per-user gateable feature. Stored as the DISABLED set (no row = enabled).
        MFA is the one inverted-default, login-scoped flag: users start with it disabled
        (email MFA is opt-in), and it gates only the login flow.

    Language:
      type: string
      enum: [en, pl]
      description: >-
        A supported UI/email language. The ONE synced per-user language (V1) — set at
        create, changed only via PUT /users/{id}/language; drives the SPA at sign-in and
        every email sent to the user.

    UserLanguageUpdateRequest:
      type: object
      required: [language]
      properties:
        language:
          $ref: '#/components/schemas/Language'

    UserFeaturesUpdateRequest:
      type: object
      required: [disabledFeatures]
      properties:
        disabledFeatures:
          type: array
          items: { $ref: '#/components/schemas/Feature' }
          description: The complete new DISABLED set — an empty array enables everything.

    MfaChallengeResponse:
      type: object
      required: [mfaRequired, challengeId, expiresAt]
      properties:
        mfaRequired:
          type: boolean
          description: Always true — the discriminator against LoginResponse in the login 200.
        challengeId:
          type: string
          description: Opaque single-use challenge id; send it back with the emailed code.
        expiresAt:
          type: integer
          format: int64
          description: Challenge (and code) expiry as Unix epoch milliseconds.

    MfaVerifyRequest:
      type: object
      required: [challengeId, code]
      properties:
        challengeId: { type: string }
        code:
          type: string
          description: The 6-digit code from the sign-in email.

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: Optional refresh token to revoke together with the access token.

    UserCreateRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        email: { type: string, maxLength: 254 }
        password:
          type: string
          minLength: 10
          maxLength: 71
          description: >-
            Client-generated; at most 71 UTF-8 bytes (the bcrypt ceiling). Stored only as a
            hash and never returned.
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
          description: Additional roles; omitted/empty = a regular user.
        language:
          allOf: [{ $ref: '#/components/schemas/Language' }]
          nullable: true
          description: Create-only (the whole-user PUT never touches it); omitted = en.

    UserUpdateRequest:
      type: object
      required: [name, email, roles]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        email: { type: string, maxLength: 254 }
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }

    UserResponse:
      type: object
      required: [id, name, email, roles, disabledFeatures, language]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        email: { type: string }
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
          description: Additional roles only — empty for a regular user.
        disabledFeatures:
          type: array
          items: { $ref: '#/components/schemas/Feature' }
          description: Per-user feature flags — the admin-disabled set; empty = full access.
        language:
          $ref: '#/components/schemas/Language'

    UserPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    UserDirectoryEntry:
      type: object
      required: [id, name, email]
      description: The whole directory projection - nothing else about a user is exposed.
      properties:
        id: { type: integer, format: int32, minimum: 1 }
        name: { type: string }
        email: { type: string }

    UserDirectoryPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserDirectoryEntry'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    PasswordUpdateRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 10
          maxLength: 71
          description: The new password (at least 10 characters, at most 71 UTF-8 bytes).
        currentPassword:
          type: string
          description: >-
            Required when the caller changes their OWN password (even an admin); omitted
            for an admin resetting somebody else's.

    TeamCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true }
        managerId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: >-
            The team's manager, a user; must be active (`400` otherwise).
    TeamUpdateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true }
        managerId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: >-
            The team's manager, a user; must be active (`400` otherwise). Omitted on PUT (a full replace) = no manager.
    TeamResponse:
      type: object
      required: [id, name, managerId, managerName, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        managerId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: The team's manager; null when unset or when the assigned user was soft-deleted.
        managerName: { type: string, nullable: true, description: The manager's display name; null with `managerId`. }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
    TeamListItem:
      type: object
      required: [id, name, managerId, managerName, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        managerId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: The team's manager; null when unset or when the assigned user was soft-deleted.
        managerName: { type: string, nullable: true, description: The manager's display name; null with `managerId`. }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
    TeamPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TeamListItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0

    AdrStatus:
      type: string
      enum: [PROBLEM_RAISED, SOLUTION_DRAFT, IN_REVIEW, ACTIVE, CANCELLED, WITHDRAWN, EXPIRED, SUPERSEDED]
      description: >-
        The lifecycle. `EXPIRED` and `SUPERSEDED` are reached by the system only; `CANCELLED`, `WITHDRAWN`, `EXPIRED` and `SUPERSEDED`
        are terminal (read-only).
    AdrRole:
      type: string
      enum: [DRIVER, APPROVER, CONTRIBUTOR, INFORMED]
      description: The DACI roles - one Driver, at most one Approver, any number of Contributors and Informed.
    AdrParticipantRequest:
      type: object
      required: [userId, role]
      properties:
        userId: { type: integer, format: int32, minimum: 0 }
        role: { $ref: '#/components/schemas/AdrRole' }
    AdrParticipant:
      type: object
      required: [userId, name, role]
      properties:
        userId: { type: integer, format: int32, minimum: 0 }
        name: { type: string, description: "The user's display name as it is now (kept for a soft-deleted account)." }
        role: { $ref: '#/components/schemas/AdrRole' }
    AdrCreateRequest:
      type: object
      required: [problem]
      properties:
        name:
          type: string
          maxLength: 120
          nullable: true
          description: 1 to 120 characters, single line, unique among active ADRs (case- and accent-insensitively). Omitted or blank = the problem's first line, cut to 120.
        problem: { type: string, maxLength: 20000, description: "The problem or question (Markdown); required, not blank." }
        context: { type: string, maxLength: 20000, description: "Why it matters, constraints, assumptions (Markdown); required to enter `IN_REVIEW`." }
        decision: { type: string, maxLength: 20000, description: "The decision (Markdown); required to enter `IN_REVIEW`." }
        alternatives: { type: string, maxLength: 20000, description: "The alternatives considered (Markdown); optional." }
        consequences: { type: string, maxLength: 20000, description: "The accepted consequences and side effects (Markdown); required to enter `IN_REVIEW`." }
        expiresOn:
          type: string
          format: date
          nullable: true
          description: The last day the decision is in force, `YYYY-MM-DD`; not in the past.
        participants:
          type: array
          maxItems: 99
          items: { $ref: '#/components/schemas/AdrParticipantRequest' }
          description: Extra participants - never a Driver (the caller is) and never the caller; each user once, at most one Approver.
    AdrUpdateRequest:
      type: object
      required: [name, problem]
      description: The complete new document (PUT is a full replace).
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        problem: { type: string, maxLength: 20000 }
        context: { type: string, maxLength: 20000 }
        decision: { type: string, maxLength: 20000 }
        alternatives: { type: string, maxLength: 20000 }
        consequences: { type: string, maxLength: 20000 }
        expiresOn:
          type: string
          format: date
          nullable: true
          description: The last day the decision is in force, `YYYY-MM-DD`; omitted = no expiry. A changed date must not be in the past.
    AdrTransitionRequest:
      type: object
      required: [to]
      properties:
        to: { $ref: '#/components/schemas/AdrStatus' }
        reason:
          type: string
          nullable: true
          maxLength: 1000
          description: >-
            Why (optional, 0.7.0): free text of at most 1000 code points, after trimming; control characters and hidden direction characters are `400`,
            blank is none. Kept in the `TRANSITIONED` event, shown in the history; never in a notice or an email.
    AdrTag:
      type: object
      required: [name, retired]
      properties:
        name: { type: string, minLength: 1, maxLength: 40, description: The normalised tag name. }
        retired: { type: boolean, description: The registry dropped this tag since it was set; it stays on the ADR (shown as retired) until a tag write removes it. }
    AdrTagsRequest:
      type: object
      required: [tags]
      properties:
        tags:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 40 }
          description: The whole tag set - live registry tags, each once; empty clears it.
    AdrSupersedesRequest:
      type: object
      properties:
        supersedesId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: The ADR this one replaces; omitted or null removes the link (a full replace).
    AdrSuccessorAcceptRequest:
      type: object
      required: [successorId]
      properties:
        successorId:
          type: integer
          format: int32
          minimum: 0
          description: The pending successor being accepted (the one in `supersededBy`); anything else is `404`.
    AdrRef:
      type: object
      required: [id, key, name, status]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        key: { type: string, example: ADR-0042 }
        name: { type: string }
        status: { $ref: '#/components/schemas/AdrStatus' }
    AdrParticipantsRequest:
      type: object
      required: [participants]
      properties:
        participants:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/AdrParticipantRequest' }
          description: The whole set - exactly one Driver, at most one Approver, each user once.
    AdrResponse:
      type: object
      required:
        - id
        - number
        - key
        - name
        - problem
        - context
        - decision
        - alternatives
        - consequences
        - status
        - expiresOn
        - revision
        - createdAt
        - createdById
        - updatedAt
        - statusChangedAt
        - participants
        - tags
        - supersedes
        - supersedesAccepted
        - supersededBy
        - supersededByAccepted
        - allowedTransitions
        - canEditContent
        - canEditExpiry
        - canManageParticipants
        - canChangeApprover
        - canEditTags
        - canEditSuccessor
        - canDetachSuccessor
        - canAcceptSuccessor
        - canComment
        - canRaiseIssue
        - openIssueCount
        - unansweredQuestionCount
      properties:
        id: { type: integer, format: int32, minimum: 0, description: "The row id; URLs use it." }
        number: { type: integer, format: int32, minimum: 1, description: "The global gapless counter; never reused." }
        key: { type: string, example: ADR-0042, description: '`ADR-` + the number zero-padded to four digits.' }
        name: { type: string }
        problem: { type: string }
        context: { type: string }
        decision: { type: string }
        alternatives: { type: string }
        consequences: { type: string }
        status: { $ref: '#/components/schemas/AdrStatus' }
        expiresOn: { type: string, format: date, nullable: true, description: "The last day the decision is in force; the sweep expires an `ACTIVE` ADR the day after." }
        revision: { type: integer, format: int64, minimum: 1, description: "Send it back as `X-Expected-Revision` on the document PUT, a transition and the participants, tags and supersedes PUTs; every real change of any of them bumps it (accepting or detaching a successor writes a successor's revision only when it changes the link)." }
        createdAt: { type: integer, format: int64, description: "Epoch millis" }
        createdById: { type: integer, format: int32, minimum: 0, description: "The creating user (the first Driver)." }
        updatedAt: { type: integer, format: int64, description: "Epoch millis" }
        statusChangedAt: { type: integer, format: int64, description: "Epoch millis" }
        participants:
          type: array
          items: { $ref: '#/components/schemas/AdrParticipant' }
          description: Driver first, then the Approver, the Contributors and the Informed.
        tags:
          type: array
          items: { $ref: '#/components/schemas/AdrTag' }
          description: The ADR's tags, alphabetical; a `retired` one is no longer in the registry.
        supersedes:
          allOf:
            - $ref: '#/components/schemas/AdrRef'
          nullable: true
          description: The ADR this one replaces (set while pre-active; it takes effect when this one becomes `ACTIVE`); null for none. A soft-deleted predecessor reads as null.
        supersedesAccepted: { type: boolean, description: "The predecessor's Approver (or ADMIN) accepted the link in `supersedes` (false when there is none). Activating over an `ACTIVE` predecessor needs it." }
        supersededBy:
          allOf:
            - $ref: '#/components/schemas/AdrRef'
          nullable: true
          description: The ADR replacing this one - its pending successor, or once this one is `SUPERSEDED` the one that replaced it, even if that one was withdrawn after it took effect; never one cancelled or withdrawn before it activated, and never a pending one once this ADR was itself cancelled, withdrawn or expired (the successor keeps the link until its Driver removes it). Null for none.
        supersededByAccepted: { type: boolean, description: "The link to `supersededBy` was accepted by this ADR's Approver (or ADMIN); always true once it took effect, false when there is none." }
        allowedTransitions:
          type: array
          items: { $ref: '#/components/schemas/AdrStatus' }
          description: The moves THIS caller may request now (the buttons); never `EXPIRED` or `SUPERSEDED`.
        canEditContent: { type: boolean, description: "This caller may change the content (the name and the five Markdown fields) now: the ADR is pre-active and the caller is the Driver, a Contributor or ADMIN." }
        canEditExpiry: { type: boolean, description: "This caller may change the expiry date now: the Driver, the Approver or ADMIN on a non-terminal ADR until it is `ACTIVE`; only the Approver or ADMIN once it is (the decision in force is the Approver's); nobody on a terminal ADR." }
        canManageParticipants: { type: boolean, description: "This caller may replace the participants now." }
        canChangeApprover: { type: boolean, description: "This caller may add, remove or replace the Approver now: ADMIN; the Driver or the Approver until the ADR has first been in review; only the Approver from then on (in review, in force, or a draft again after a send back); nobody on a terminal ADR. Nobody but ADMIN can name themselves the Approver, whatever this says." }
        canEditTags: { type: boolean, description: "This caller may replace the tags now (the Driver, the Approver or ADMIN, on a non-terminal ADR - tags stay editable once ACTIVE)." }
        canEditSuccessor: { type: boolean, description: "This caller may link or unlink the predecessor now (the Driver, the Approver or ADMIN, while the ADR is pre-active)." }
        canDetachSuccessor: { type: boolean, description: "This caller may detach the pending successor now (the Driver, the Approver or ADMIN of THIS ADR, which has a successor still pre-active)." }
        canAcceptSuccessor: { type: boolean, description: "This caller may accept the pending successor now (the Approver or ADMIN of THIS `ACTIVE` ADR, which has a successor still pre-active whose link is not yet accepted)." }
        canComment: { type: boolean, description: "The discussion takes a comment or a question now (the ADR is `PROBLEM_RAISED`, `SOLUTION_DRAFT` or `IN_REVIEW`); anyone authenticated may post." }
        canRaiseIssue: { type: boolean, description: "The discussion takes an issue or an escalation now (the ADR is `ACTIVE`); anyone authenticated may post." }
        openIssueCount: { type: integer, minimum: 0, description: "The OPEN issues and escalations (deleted entries excluded)." }
        unansweredQuestionCount: { type: integer, minimum: 0, description: "The OPEN questions (deleted entries excluded)." }
    AdrListItem:
      type: object
      required: [id, number, key, name, status, expiresOn, revision, createdAt, updatedAt, statusChangedAt, driver, approver, tags, openIssueCount]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
